                const streakRisk = h._streak >= 3 && overdueRatio >= 0.8 ? 40 : 0;
                const overdueScore = Math.max(0, overdueRatio - 0.8) * 30;
                const missScore = (h._consistency || 0) * 25;
                const neglectScore = Math.min(20, h._daysSinceLast / Math.max(1, h._intervalDays) * 10);
                h._missionScore = streakRisk + overdueScore + missScore + neglectScore;

                if (streakRisk > 0) {
                    return { habit: h, reason: `${h._streak}-day streak is at risk`, action: 'Protect streak' };
                }
                if (h._overdueDays > 0) {
                    return { habit: h, reason: `${Math.round(h._overdueDays)} day${Math.round(h._overdueDays) === 1 ? '' : 's'} overdue`, action: 'Check in' };
                }
                if ((h._consistency || 0) >= 0.45) {
                    return { habit: h, reason: 'Missed too many recent sessions', action: 'Restart momentum' };
                }
                return { habit: h, reason: 'Due today', action: 'Check in' };
            }).sort((a, b) => b.habit._missionScore - a.habit._missionScore).slice(0, 3);

            if (unfinished.length === 0) {
                return `<div class="mission"><div class="mission-header"><div class="mission-title">TODAY'S MISSION</div><div class="mission-count">${activeHabits.length}/${activeHabits.length} complete</div></div><div class="mission-complete">✓ Everything is done for today. Keep the streak alive.</div></div>`;
            }

            return `<div class="mission">
                <div class="mission-header"><div class="mission-title">TODAY'S MISSION</div><div class="mission-count">${unfinished.length} next action${unfinished.length === 1 ? '' : 's'}</div></div>
                ${unfinished.map((item, index) => `<div class="mission-item">
                    <div class="mission-rank">${index + 1}</div>
                    <div class="mission-info" onclick="selectHabit('${item.habit.id}')"><div class="mission-name">${item.habit.name}</div><div class="mission-reason">${item.reason}</div></div>
                    <button class="mission-action" onclick="toggleCheckin('${item.habit.id}')">${item.action}</button>
                </div>`).join('')}
            </div>`;
        }

        function render() {
            const container = document.getElementById('habitContainer');
            
            let habits = allHabits.map(h => {
                const mapped = {
                    ...h,
                    _status: getHabitStatus(h),
                    _streak: calcStreak(h.id),
                    _project: findMatchingProject(h),
                    _weeklyExpected: getExpectedWeeklyFreq(h),
                    _intervalDays: getIntervalDays(h)
                };
                mapped._urgency = calcUrgency(h);
                const dStamps = (allCheckins[h.id] || []).filter(c => c.status === 2).map(c => c.checkinStamp).sort((a,b)=>b-a);
                let rawDaysSince;
                if (dStamps.length > 0) {
                    rawDaysSince = Math.max(0, Math.floor((new Date() - stampToDate(dStamps[0])) / 86400000));
                } else {
                    rawDaysSince = getHabitAge(h); // no stamps → use habit age
                }
                mapped._daysSinceLast = Math.min(rawDaysSince, getHabitAge(h));
                mapped._outsideWindow = dStamps.length === 0 && h.totalCheckIns > 0;
                mapped._overdueDays = Math.max(0, mapped._daysSinceLast - mapped._intervalDays);
                // Consistency: 1 = never done, 0 = perfect (done/expected from last 7 cycles)
                const cp = getCycleProgress(mapped, 7);
                mapped._consistency = cp.expected > 0 ? Math.max(0, 1 - cp.done / cp.expected) : 0;
                return mapped;
            });

            budgetHabits = habits;
            updateHabitTimeBudget(budgetHabits);

            // Stats
            const activeHabits = habits.filter(h => h._status !== 'archived');
            const statusCounts = { active: 0, slipping: 0, dying: 0 };
            activeHabits.forEach(h => statusCounts[h._status]++);
            
            const todaysDone = activeHabits.filter(h => {
                const checkins = allCheckins[h.id] || [];
                return checkins.some(c => c.checkinStamp === todayStamp() && c.status === 2);
            }).length;

            const bestStreak = Math.max(0, ...habits.map(h => h._streak));

            let filtered = habits.filter(h => {
                if (h._status === 'archived') return habitViewFilter === 'all';
                const state = getHabitTodayState(h);
                if (habitViewFilter === 'today' && !state.scheduled && !state.completed) return false;
                if (habitViewFilter === 'incomplete' && (!state.scheduled || state.completed)) return false;
                if (habitViewFilter === 'completed' && !state.completed) return false;
                if (habitViewFilter === 'partial' && !state.partial) return false;
                if (habitViewFilter === 'overdue' && h._overdueDays <= 0 && h._status !== 'dying' && h._status !== 'slipping') return false;
                return matchesHabitDuration(h) && matchesHabitSearchAndType(h);
            });

            filtered.sort((a, b) => {
                const aState = getHabitTodayState(a);
                const bState = getHabitTodayState(b);
                const aDone = getMonthlyScore(a).pct;
                const bDone = getMonthlyScore(b).pct;
                if (habitSortFilter === 'least-done') return aDone - bDone;
                if (habitSortFilter === 'most-done') return bDone - aDone;
                if (habitSortFilter === 'overdue') return b._overdueDays - a._overdueDays;
                if (habitSortFilter === 'shortest') return getHabitDurationMinutes(a) - getHabitDurationMinutes(b);
                if (habitSortFilter === 'longest') return getHabitDurationMinutes(b) - getHabitDurationMinutes(a);
                if (aState.actionable !== bState.actionable) return aState.actionable ? -1 : 1;
                if (Math.abs(b._overdueDays - a._overdueDays) > 0.5) return b._overdueDays - a._overdueDays;
                if (Math.abs(b._consistency - a._consistency) > 0.01) return b._consistency - a._consistency;
                return b._daysSinceLast - a._daysSinceLast;
            });

            renderedHabits = filtered;
            const summary = document.getElementById('habitFilterSummary');
            if (summary) summary.textContent = `${filtered.length} habit${filtered.length === 1 ? '' : 's'} shown`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-data">No habits found for this filter</div>`;
                return;
            }

            renderHabitWeekHeader();
            const sectionsById = new Map(allHabitSections.map(section => [section.id, section]));
            const groupedSections = new Map();
            filtered.forEach(habit => {
                const section = sectionsById.get(habit.sectionId);
                const sectionId = section?.id || '__other__';
                if (!groupedSections.has(sectionId)) {
                    groupedSections.set(sectionId, {
                        name: section?.name || 'Other habits',
                        sortOrder: Number(section?.sortOrder) || Number.MAX_SAFE_INTEGER,
                        habits: []
                    });
                }
                groupedSections.get(sectionId).habits.push(habit);
            });
            container.innerHTML = Array.from(groupedSections.values())
                .sort((a, b) => a.sortOrder - b.sortOrder || a.name.localeCompare(b.name))
                .map(group => `<div class="habit-section-heading">${group.name}</div>${group.habits.map(habit => renderHabitItem(habit)).join('')}`)
                .join('');

            // Auto-select first if nothing selected or selected not in list
            if (!selectedHabitId || !filtered.find(h => h.id === selectedHabitId)) {
                selectHabit(filtered[0].id);
            } else {
                selectHabit(selectedHabitId);
            }

        }

        function getHabitWeekDays() {
            const today = new Date();
            return Array.from({ length: 7 }, (_, index) => {
                const date = new Date(today);
                date.setHours(0, 0, 0, 0);
                date.setDate(today.getDate() - (6 - index));
                return date;
            });
        }

        function renderHabitWeekHeader() {
            const header = document.getElementById('habitWeekHeader');
            if (!header) return;
            const todayStampValue = todayStamp();
            const days = getHabitWeekDays();
            header.innerHTML = '<div class="habit-week-header-name">Habit</div>' + days.map(day => {
                const isToday = getStamp(day) === todayStampValue;
                return `<div class="habit-week-day ${isToday ? 'today' : ''}">
                    <strong>${day.toLocaleDateString('en-US', { weekday: 'short' })}</strong>
                    <span>${day.getDate()}</span>
                </div>`;
            }).join('');
        }

        function getHabitIcon(habit) {
            const resource = String(habit.iconRes || '').toLowerCase();
            const value = String(habit.name || '').toLowerCase();
            const iconMap = [
                [/water|drink|juice|water/, '💧'],
                [/protein|egg|med|vitamin|creatine|pill/, '🥗'],
                [/workout|run|walk|step|sunlight|sport|exercise/, '🏃'],
                [/sleep|bed|brush|hair|skin|face|bath/, '🌙'],
                [/read|book|english|learn|study/, '📚'],
                [/fast/, '⏳'],
                [/work|project|task|review|inbox/, '🎯'],
                [/shop|travel|family|mummy|contact/, '🤝']
            ];
            const match = iconMap.find(([pattern]) => pattern.test(resource) || pattern.test(value));
            const color = /^#[0-9a-f]{6}$/i.test(String(habit.color || '')) ? habit.color : '#dbeafe';
            return { glyph: match ? match[1] : '✦', color };
        }

        // Detect if a unit is time-based (hour/hours/Hour/min/minute/minutes etc.)
        function isTimerUnit(unit) {
            if (!unit) return false;
            return /^(hour|hours|hr|hrs|minute|minutes|min|mins)$/i.test(unit.trim());
        }
        function isHourUnit(unit) {
            if (!unit) return false;
            return /^(hour|hours|hr|hrs)$/i.test(unit.trim());
        }

        function isQuantifiedHabit(habit) {
            return Boolean(habit && (habit.type === 'Real' || Number(habit.goal) > 1));
        }

        function getHabitGoalValue(habit) {
            return Number(habit?.goal) || 1;
        }

        function getHabitStepValue(habit) {
            const step = Number(habit?.step);
            return Number.isFinite(step) && step !== 0 ? Math.abs(step) : 1;
        }

        function formatHabitProgressValue(habit, value) {
            if (isHourUnit(habit?.unit)) return formatHabitMinutes(value * 60);
            if (isTimerUnit(habit?.unit)) return formatHabitMinutes(value);
            return `${value}`;
        }

        async function saveHabitProgress(habitId, value, buttonEvent) {
            if (buttonEvent) buttonEvent.stopPropagation();
            const habit = allHabits.find(item => item.id === habitId);
            if (!habit) return;
            const goal = getHabitGoalValue(habit);
            const nextValue = Math.min(goal, Math.max(0, Number(value) || 0));
            try {
                await checkinHabit(habitId, todayStamp(), nextValue);
                const checkins = allCheckins[habitId] || [];
                const existing = checkins.find(checkin => checkin.checkinStamp === todayStamp());
                const updated = { habitId, checkinStamp: todayStamp(), value: nextValue, goal, status: nextValue >= goal ? 2 : 0 };
                allCheckins[habitId] = existing
                    ? checkins.map(checkin => checkin === existing ? { ...checkin, ...updated } : checkin)
                    : [...checkins, updated];
                render();
                renderDetail();
            } catch (error) {
                console.error('[CHECKIN] Progress update failed:', error);
            }
        }

        function addHabitProgress(habitId, amount, buttonEvent) {
            const current = (allCheckins[habitId] || []).find(checkin => checkin.checkinStamp === todayStamp());
            saveHabitProgress(habitId, (Number(current?.value) || 0) + amount, buttonEvent);
        }

        function addHabitProgressFromInput(habitId, input, buttonEvent) {
            const habit = allHabits.find(item => item.id === habitId);
            const amount = Number(input?.value);
            if (!habit || !Number.isFinite(amount) || amount <= 0) return;
            const nativeAmount = isHourUnit(habit.unit) ? amount / 60 : amount;
            input.value = '';
            addHabitProgress(habitId, nativeAmount, buttonEvent);
        }

        function openHabitProgressModal(habitId, buttonEvent) {
            if (buttonEvent) buttonEvent.stopPropagation();
            const habit = allHabits.find(item => item.id === habitId);
            const modal = document.getElementById('habitProgressModal');
            const input = document.getElementById('habitProgressAmount');
            const unit = document.getElementById('habitProgressUnit');
            if (!habit || !modal || !input || !unit) return;
            progressModalHabitId = habitId;
            input.value = '';
            input.placeholder = isHourUnit(habit.unit) ? 'e.g. 35' : 'e.g. 1';
            unit.textContent = isHourUnit(habit.unit) ? 'min' : (habit.unit || 'times');
            modal.classList.add('open');
            requestAnimationFrame(() => input.focus());
        }

        function closeHabitProgressModal() {
            const modal = document.getElementById('habitProgressModal');
            if (modal) modal.classList.remove('open');
            progressModalHabitId = null;
        }

        function confirmHabitProgressModal() {
            const habit = allHabits.find(item => item.id === progressModalHabitId);
            const input = document.getElementById('habitProgressAmount');
            const amount = Number(input?.value);
            if (!habit || !Number.isFinite(amount) || amount <= 0) {
                input?.focus();
                return;
            }
            const nativeAmount = isHourUnit(habit.unit) ? amount / 60 : amount;
            const habitId = progressModalHabitId;
            closeHabitProgressModal();
            addHabitProgress(habitId, nativeAmount);
        }

        function renderQuantifiedProgress(habit, todayCheckin) {
            const goal = getHabitGoalValue(habit);
            const current = Math.min(goal, Number(todayCheckin?.value) || 0);
            const pct = Math.min(100, Math.round((current / goal) * 100));
            const unitLabel = isTimerUnit(habit.unit) ? '' : ` ${habit.unit || 'times'}`;
            return `<div class="timer-progress">
                <div class="timer-progress-header"><span>📌 ${formatHabitProgressValue(habit, current)} / ${formatHabitProgressValue(habit, goal)}${unitLabel}</span><span>${pct}%</span></div>
                <div class="timer-progress-bar"><div class="timer-progress-fill" style="width:${pct}%;background:${pct >= 100 ? '#10b981' : '#3b82f6'}"></div></div>
                ${current < goal ? `<div class="habit-progress-actions"><button onclick="openHabitProgressModal('${habit.id}', event)">Add progress</button><button class="complete" onclick="saveHabitProgress('${habit.id}', ${goal}, event)">Complete</button></div>` : ''}</div>`;
        }

        // Timer progress uses Pomodoro minutes when available, otherwise TickTick's
        // measured check-in value for the current day.
        function renderTimerProgress(habit, todayCheckin) {
            if (isQuantifiedHabit(habit)) return renderQuantifiedProgress(habit, todayCheckin);
            if (!isTimerUnit(habit.unit)) return '';
            const goal = habit.goal || 1;
            const goalMinutes = isHourUnit(habit.unit) ? goal * 60 : goal;
            const pomodoroMinutes = pomodoroStats[habit.name] || 0;
            const checkinValue = todayCheckin && Number(todayCheckin.value) > 0
                ? Number(todayCheckin.value)
                : 0;
            const trackedMinutes = pomodoroMinutes > 0 ? pomodoroMinutes : checkinValue;
            const pct = Math.min(100, Math.round((trackedMinutes / goalMinutes) * 100));
            const isComplete = trackedMinutes >= goalMinutes;

            // Format display
            const displayValue = trackedMinutes >= 60 ? `${Math.floor(trackedMinutes/60)}h ${trackedMinutes%60}m` : `${trackedMinutes}m`;
            const displayGoal = goalMinutes >= 60 ? `${Math.floor(goalMinutes/60)}h${goalMinutes%60 > 0 ? ' ' + goalMinutes%60 + 'm' : ''}` : `${goalMinutes}m`;

            const barColor = isComplete ? '#10b981' : pct >= 50 ? '#f59e0b' : '#3b82f6';
            return `
                <div class="timer-progress">
                    <div class="timer-progress-header">
                        <span>⏱️ ${displayValue} / ${displayGoal}</span>
                        <span style="color:${barColor};font-weight:600">${isComplete ? '✓ Done' : pct + '%'}</span>
                    </div>
                    <div class="timer-progress-bar">
                        <div class="timer-progress-fill" style="width:${pct}%;background:${barColor}"></div>
                    </div>
                </div>`;
        }

        function renderHabitItem(habit) {
            const checkins = allCheckins[habit.id] || [];
            const today = todayStamp();
            const todayCheckin = checkins.find(c => c.checkinStamp === today);
            const todayDone = todayCheckin && todayCheckin.status === 2;
            const status = getStatusTag(habit);
            const weekDays = getHabitWeekDays();
            const doneStamps = new Set(checkins.filter(c => c.status === 2).map(c => c.checkinStamp));
            const partialCheckins = new Map(checkins
                .filter(c => c.status !== 2 && Number(c.value) > 0)
                .map(c => [c.checkinStamp, c]));
            const weekCells = weekDays.map(day => {
                const stamp = getStamp(day);
                const isToday = stamp === today;
                const isFuture = day > new Date();
                const excluded = isHabitExcludedOnStamp(habit, stamp);
                const done = doneStamps.has(stamp);
                const partial = partialCheckins.get(stamp);
                const partialText = partial ? `${Number(partial.value)}${habit.goal ? '/' + Number(habit.goal) : ''}` : '';
                const cellClass = excluded ? 'future' : done ? 'done' : partial ? 'partial' : isFuture ? 'future' : 'missed';
                const cellTitle = excluded ? 'Excluded' : done ? 'Completed' : partial ? `In progress: ${partialText}` : isFuture ? 'Upcoming' : 'Not completed';
                return `<div class="habit-week-cell ${cellClass} ${isToday ? 'today' : ''}" title="${cellTitle}">${excluded ? '–' : done ? '✓' : partial ? partialText : '·'}</div>`;
            }).join('');
            // Build 7 cycle dots (most recent on right)
            const interval = habit._intervalDays || 1;
            const now = new Date();
            const ageDays = getHabitAge(habit);
            let dotsHtml = '';
            let doneCount = 0;
            for (let i = 6; i >= 0; i--) {
                // Each cycle: check if any checkin exists in that cycle's window
                const cycleStart = Math.round(i * interval);
                const cycleEnd = Math.round((i + 1) * interval);
                if (cycleStart >= ageDays) {
                    dotsHtml += '<div class="cycle-dot future"></div>';
                    continue;
                }
                let hasDone = false;
                for (let d = cycleStart; d < cycleEnd; d++) {
                    const dt = new Date(now); dt.setDate(dt.getDate() - d);
                    const stamp = getStamp(dt);
                    if (!isHabitExcludedOnStamp(habit, stamp) && doneStamps.has(stamp)) { hasDone = true; break; }
                }
                if (hasDone) doneCount++;
                dotsHtml += `<div class="cycle-dot ${hasDone ? 'done' : 'missed'}"></div>`;
            }

            const isSelected = habit.id === selectedHabitId;
            return `
            <div class="habit-item ${habit._status} ${isSelected ? 'selected' : ''}" onclick="handleHabitRowClick('${habit.id}', event)" onpointerdown="startHabitHold('${habit.id}', event)" onpointerup="endHabitHold(event)" onpointerleave="endHabitHold(event)" onpointercancel="endHabitHold(event)">
                <div class="habit-week-grid">
                    <div class="habit-week-name"><span class="habit-icon" aria-hidden="true" style="background:${getHabitIcon(habit).color}22;border-color:${getHabitIcon(habit).color}55">${getHabitIcon(habit).glyph}</span><span class="habit-name-copy"><span class="habit-week-name-text">${habit.name}</span><small>${parseRepeatRule(habit.repeatRule)} · ${status.text}</small></span></div>
                    ${weekCells}
                </div>
                ${renderTimerProgress(habit, todayCheckin)}
            </div>`;
        }

        function selectHabit(habitId) {
            selectedHabitId = habitId;
            // Update selection highlight
            document.querySelectorAll('.habit-item').forEach(el => el.classList.remove('selected'));
            const items = document.querySelectorAll('.habit-item');
            items.forEach(el => {
                if (el.getAttribute('onclick')?.includes(habitId)) el.classList.add('selected');
            });
            renderDetail();
            showDetailOnMobile(); // Auto-switch to detail on mobile
        }

        function handleHabitRowClick(habitId, rowEvent) {
            if (rowEvent?.target?.closest('button, input, select, a')) return;
            selectHabit(habitId);
        }

        function startHabitHold(habitId, holdEvent) {
            if (holdEvent?.target?.closest('button, input, select, a')) return;
            window.clearTimeout(habitHoldTimer);
            habitHoldTriggered = false;
            habitHoldTimer = window.setTimeout(() => {
                habitHoldTriggered = true;
                handleHabitCheckin(habitId, holdEvent);
            }, 900);
        }

        function endHabitHold(holdEvent) {
            if (holdEvent?.target?.closest('button, input, select, a')) return;
            window.clearTimeout(habitHoldTimer);
            habitHoldTimer = null;
        }

        function handleHabitCheckin(habitId, checkinEvent) {
            if (checkinEvent) checkinEvent.stopPropagation();
            selectHabit(habitId);
            const habit = allHabits.find(item => item.id === habitId);
            if (!habit) return;
            if (isQuantifiedHabit(habit)) {
                const todayCheckin = (allCheckins[habitId] || []).find(checkin => checkin.checkinStamp === todayStamp());
                if (todayCheckin?.status === 2) {
                    saveHabitProgress(habitId, 0, checkinEvent);
                } else {
                    openHabitProgressModal(habitId, checkinEvent);
                }
                return;
            }
            toggleCheckin(habitId);
        }

        function renderDetail() {
            const panel = document.getElementById('detailPanel');
            const habit = renderedHabits.find(h => h.id === selectedHabitId);
            if (!habit) {
                panel.innerHTML = '<div class="detail-empty">← Click a habit to see analysis</div>';
                return;
            }

            const checkins = allCheckins[habit.id] || [];
            const today = todayStamp();
            const todayCheckin = checkins.find(c => c.checkinStamp === today);
            const todayDone = Boolean(todayCheckin && todayCheckin.status === 2);
            const todayHasProgress = Boolean(todayCheckin && (todayDone || Number(todayCheckin.value) > 0));
            const ageDays = getHabitAge(habit);
            const intervalDays = habit._intervalDays;
            const status = getStatusTag(habit);
            const streakInfo = getStreakWithUnit(habit);
            const bestStreak = calcBestStreak(habit.id);
            const streakGap = bestStreak - habit._streak;
            const streakColor = habit._streak >= 7 ? '#10b981' : habit._streak >= 3 ? '#f59e0b' : '#ef4444';
            const monthly = getMonthlyScore(habit);
            const yearCutoff = new Date();
            yearCutoff.setDate(yearCutoff.getDate() - Math.min(ageDays, 365));
            const yearDone = checkins.filter(c => c.status === 2 && stampToDate(c.checkinStamp) >= yearCutoff).length;
            const yearExpected = Math.max(1, Math.round(getExpectedWeeklyFreq(habit) * Math.min(ageDays, 365) / 7));
            const yearPct = Math.min(100, Math.round((yearDone / yearExpected) * 100));
            const totalDone = checkins.filter(c => c.status === 2).length;

            // ── Weekly stats (for nudge/trend) ──
            const weekWindow = Math.min(ageDays, 7);
            const weekCutoff = new Date(); weekCutoff.setDate(weekCutoff.getDate() - weekWindow);
            const weekCheckins = checkins.filter(c => {
                const d = stampToDate(c.checkinStamp);
                return c.status === 2 && d >= weekCutoff;
            }).length;
            const weekExpected = Math.max(1, Math.ceil(getExpectedWeeklyFreq(habit) * weekWindow / 7));

            // ── Nudge ──
            let nudge = '';
            if (todayDone) {
                nudge = `✅ <strong>Done today!</strong> `;
                if (habit._streak >= 3) nudge += `You're on a ${streakInfo.count}-${streakInfo.unit} streak — keep it going!`;
                else nudge += `Great start. Come back tomorrow to build your streak!`;
                if (habit._streak > 0 && habit._streak >= bestStreak) nudge += ` 🏆 <strong>New record!</strong>`;
            } else if (habit._streak >= 3 && streakGap <= 3 && streakGap > 0) {
                nudge = `🔥 Your <strong>${streakInfo.count}-${streakInfo.unit} streak</strong> is at risk! Do it now — only <strong>${streakGap} more</strong> to beat your best of ${bestStreak}!`;
            } else if (habit._streak >= 3) {
                nudge = `🔥 You have a <strong>${streakInfo.count}-${streakInfo.unit} streak</strong> going. Don't break it — check in today!`;
            } else if (habit._streak === 0 && habit._daysSinceLast > intervalDays * 2) {
                nudge = `🌱 <strong>Fresh start.</strong> One check-in today gets your momentum moving again.`;
            } else {
                nudge = habit._streak > 0
                    ? `🔥 <strong>Keep the chain alive.</strong> Check in today to protect your ${streakInfo.count}-${streakInfo.unit} streak.`
                    : `🌱 <strong>Build today's win.</strong> Consistency starts with one check-in.`;
            }

            // ── Progress bars ──
            const windows = getAdaptiveWindows(habit);
            let progressHtml = '';
            for (const w of windows) {
                const prog = getCycleProgress(habit, w.cycles);
                const color = prog.pct >= 80 ? '#10b981' : prog.pct >= 50 ? '#f59e0b' : '#ef4444';
                const doneText = prog.done > 0 && w.cycles === 1 ? `${prog.done}/${prog.expected} ✅` : `${prog.done}/${prog.expected}`;
                const pctText = w.cycles > 1 ? `${prog.pct}%` : '';
                const barText = prog.pct > 15 ? `${prog.pct}%` : '';
                progressHtml += `
                    <div class="progress-row">
                        <div class="progress-label">${w.label}</div>
                        <div class="progress-bar-wrap">
                            <div class="progress-bar-fill-inner" style="width:${prog.pct}%;background:${color}"></div>
                            <div class="progress-bar-text">${barText}</div>
                        </div>
                        <div class="progress-val">${doneText} ${pctText ? '<span class="progress-pct">' + pctText + '</span>' : ''}</div>
                    </div>`;
            }

            // ── Trend ──
            const lastWeekStamps = [];
            for (let i = 7; i < Math.min(14, 7 + ageDays); i++) { const d = new Date(); d.setDate(d.getDate() - i); lastWeekStamps.push(getStamp(d)); }
            const lastWeekDone = checkins.filter(c => c.status === 2 && lastWeekStamps.includes(c.checkinStamp)).length;
            const lastWeekExp = Math.max(1, Math.ceil(getExpectedWeeklyFreq(habit) * lastWeekStamps.length / 7));
            const thisWeekPct = Math.round((weekCheckins / weekExpected) * 100);
            const lastWeekPct = Math.round((lastWeekDone / lastWeekExp) * 100);
            const trendDiff = thisWeekPct - lastWeekPct;
            const trendIcon = trendDiff > 5 ? '↑' : trendDiff < -5 ? '↓' : '→';
            const trendColor = trendDiff > 5 ? '#10b981' : trendDiff < -5 ? '#ef4444' : '#f59e0b';
            const trendText = (trendDiff > 0 ? '+' : '') + trendDiff + '% vs last week';
            let milestone = '';
            if (habit._streak > 0 && habit._streak >= bestStreak) milestone = '🏆 Longest streak ever!';

            // ── Heatmap ── (show full history up to 1 year)
            const defaultView = 'day';
            const heatmapWeeks = Math.min(52, Math.ceil(Math.min(ageDays, 365) / 7));
            const dayHeatmapHtml = buildDayHeatmap(habit, heatmapWeeks);
            const weekViewHtml = buildCycleView(habit, 'week', Math.min(52, Math.ceil(ageDays / 7)));
            const monthViewHtml = buildCycleView(habit, 'month', Math.min(12, Math.ceil(ageDays / 30)));

            // ── History chart ──
            const weeklyHistoryHtml = buildHistoryChart(habit, 'week');
            const monthlyHistoryHtml = buildHistoryChart(habit, 'month');

            // ── Coach tip ──
            let coachTip = '';
            if (habit._streak > 0 && streakGap > 0 && streakGap <= 3) {
                coachTip = `🔥 You're <strong>${streakGap} ${streakInfo.unit}</strong> away from beating your all-time record of ${bestStreak}!`;
            } else if (trendDiff < -10) {
                coachTip = `📉 You dropped ${Math.abs(trendDiff)}% from last week. Pick just one day to get back on track.`;
            } else if (trendDiff > 10) {
                coachTip = `📈 Up ${trendDiff}% this week — you're building real momentum!`;
            } else if (monthly.pct >= 80) {
                coachTip = `🏆 <strong>${monthly.done}/${monthly.expected}</strong> this month — crushing it! ${habit._streak >= 7 ? "Don't break the chain!" : 'Push for a 7+ day streak!'}`;
            } else if (monthly.pct < 30 && ageDays > 14) {
                coachTip = `💡 Start small — just do it today. One day starts a streak. That streak builds the habit.`;
            } else {
                const dayOfWeekCounts = [0,0,0,0,0,0,0];
                checkins.filter(c => c.status === 2).forEach(c => { dayOfWeekCounts[stampToDate(c.checkinStamp).getDay()]++; });
                const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
                const maxDayCount = Math.max(1, ...dayOfWeekCounts);
                const strongDays = dayNames.filter((_, i) => dayOfWeekCounts[i] >= maxDayCount * 0.6);
                if (strongDays.length > 0 && strongDays.length < 5) {
                    coachTip = `💪 You're strongest on <strong>${strongDays.join(' & ')}</strong>. Use that momentum on other days too.`;
                } else {
                    coachTip = `💡 Consistency beats intensity. Show up today, even if it's less than your target.`;
                }
            }

            // ── Goal info ──
            let goalInfo = '';
            if (habit.type === 'Real' && habit.goal > 1) goalInfo = `🎯 ${habit.goal} ${habit.unit || ''} per day`;
            if (habit.targetDays > 0) goalInfo += (goalInfo ? ' · ' : '') + `📅 ${habit.targetDays}-day target`;
            const quantifiedHabit = isQuantifiedHabit(habit);
            const quantifiedComplete = quantifiedHabit && Number(todayCheckin?.value) >= getHabitGoalValue(habit);
            const detailActions = quantifiedHabit
                ? `<button class="checkin-btn" ${quantifiedComplete ? 'disabled' : ''} onclick="openHabitProgressModal('${habit.id}', event)">${quantifiedComplete ? '✓ Complete' : 'Add progress'}</button>${todayHasProgress ? `<button class="checkin-btn secondary" onclick="clearTodayCheckin('${habit.id}', event)">↩ Undo today</button>` : ''}`
                : todayHasProgress
                    ? `<button class="checkin-btn checked" disabled>✓ Checked in</button><button class="checkin-btn secondary" onclick="clearTodayCheckin('${habit.id}', event)">↩ Undo today</button>`
                    : '<button class="checkin-btn" onclick="toggleCheckin(\'' + habit.id + '\')">✓ Check in</button>';

            // ── Challenge link ──
            let challengeHtml = '';
            if (habit._project) {
                challengeHtml = `<div style="margin-bottom:12px;padding:8px 12px;background:#eef0ff;border:1px solid #c7d2fe;border-radius:6px;font-size:11px;color:#4338ca">⚔️ Linked to project: <strong>${habit._project.name}</strong></div>`;
            }

            panel.innerHTML = `
                <div class="detail-header">
                    <div class="detail-header-row">
                        <div>
                            <div class="detail-title">${habit.name}</div>
                            <div class="detail-subtitle">
                                <span>🔄 ${parseRepeatRule(habit.repeatRule)}</span>
                                ${goalInfo ? `<span>${goalInfo}</span>` : ''}
                                <span style="color:${status.color}">${status.text}</span>
                            </div>
                        </div>
                        <div class="detail-actions">
                            ${detailActions}
                        </div>
                    </div>
                </div>

                ${challengeHtml}
                ${habit.encouragement ? `<div class="detail-encourage">"${habit.encouragement}"</div>` : ''}

                <div class="hero-cards">
                    <div class="hero-card">
                        <div class="hero-card-val" style="color:#2563eb">📌 ${totalDone}</div>
                        <div class="hero-card-label">total completed</div>
                    </div>
                    <div class="hero-card">
                        <div class="hero-card-val" style="color:${streakColor}">🔥 ${streakInfo.count}</div>
                        <div class="hero-card-label">current streak</div>
                        ${habit._streak > 0 && habit._streak >= bestStreak ? '<div class="hero-card-sub" style="color:#fcd34d">🏆 New record!</div>' : ''}
                    </div>
                    <div class="hero-card">
                        <div class="hero-card-val" style="color:#7c3aed">🏆 ${bestStreak}</div>
                        <div class="hero-card-label">best streak</div>
                        <div class="hero-card-sub" style="color:${streakGap > 0 ? '#64748b' : '#10b981'}">${streakGap > 0 ? streakGap + ' to beat' : "Personal best!"}</div>
                    </div>
                </div>

                <div class="detail-section">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                        <div class="detail-section-title" style="margin-bottom:0">📅 Daily calendar</div>
                        <div class="view-tabs heatmap-tabs">
                            <button class="view-tab ${defaultView === 'day' ? 'active' : ''}" onclick="switchHeatmap('day')">Day</button>
                            <button class="view-tab ${defaultView === 'week' ? 'active' : ''}" onclick="switchHeatmap('week')">Week</button>
                            <button class="view-tab ${defaultView === 'month' ? 'active' : ''}" onclick="switchHeatmap('month')">Month</button>
                        </div>
                    </div>
                    <div>
                        <div id="heatmapDay" style="display:${defaultView === 'day' ? 'block' : 'none'}">${dayHeatmapHtml}</div>
                        <div id="heatmapWeek" style="display:${defaultView === 'week' ? 'block' : 'none'}">${weekViewHtml}</div>
                        <div id="heatmapMonth" style="display:${defaultView === 'month' ? 'block' : 'none'}">${monthViewHtml}</div>
                    </div>
                </div>

                <div class="activity-graph">
                    <div class="activity-graph-header">
                        <span class="activity-graph-title">📈 Weekly activity</span>
                        <span class="activity-graph-caption">last 8 weeks</span>
                    </div>
                    ${weeklyHistoryHtml}
                </div>

                <div class="activity-graph">
                    <div class="activity-graph-header">
                        <span class="activity-graph-title">📊 Monthly activity</span>
                        <span class="activity-graph-caption">last 12 months</span>
                    </div>
                    ${monthlyHistoryHtml}
                </div>

                <div class="coach-tip">💬 ${coachTip}</div>
            `;
        }

        // ============ ACTIONS ============

        async function clearTodayCheckin(habitId, buttonEvent) {
            if (buttonEvent) buttonEvent.stopPropagation();
            const habit = allHabits.find(item => item.id === habitId);
            if (!habit) return;
            const stamp = todayStamp();
            try {
                await checkinHabit(habitId, stamp, 0);
                allCheckins[habitId] = (allCheckins[habitId] || []).filter(checkin => checkin.checkinStamp !== stamp);
                render();
                renderDetail();
            } catch (error) {
                console.error('[CHECKIN] Could not undo today:', error);
            }
        }

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            render();
        }

        async function toggleCheckin(habitId) {
            const stamp = todayStamp();
            const checkins = allCheckins[habitId] || [];
            const habit = allHabits.find(h => h.id === habitId);
            if (isQuantifiedHabit(habit)) {
                await saveHabitProgress(habitId, getHabitGoalValue(habit));
                return;
            }
            const todayCheckin = checkins.find(c => c.checkinStamp === stamp && c.status === 2);

            try {
                if (todayCheckin) {
                    // Undo — set status to 0
                    await checkinHabit(habitId, stamp, 0);
                    // Remove from local
                    allCheckins[habitId] = checkins.filter(c => !(c.checkinStamp === stamp && c.status === 2));
                } else {
                    // Check in
                    const value = 1;
                    await checkinHabit(habitId, stamp, value);
                    // Add to local
                    if (!allCheckins[habitId]) allCheckins[habitId] = [];
                    allCheckins[habitId].push({ habitId, checkinStamp: stamp, status: 2, value, goal: habit?.goal || 1 });
                }
                render();
                renderDetail();
            } catch (e) {
                console.error('Checkin error:', e);
                alert('Failed to check in. Check console.');
            }
        }

        // ============ INIT ============

        async function refreshData() {
            const container = document.getElementById('habitContainer');
            container.innerHTML = '<div class="loading">Loading habits...</div>';

            try {
                const habits = await fetchHabits();

                // No data from proxy or cache — show paste UI
                if (!habits || habits.length === 0) {
                    showPasteUI();
                    return;
                }

                allHabits = await fetchHabitDetails(habits);
                allHabitSections = await fetchHabitSections();
                
                // Try to get projects (Open API works from file://)
                try { allProjects = await fetchProjects(); } catch { allProjects = []; }

                // Fetch checkins grouped by interval type (2 smart queries)
                try {
                    allCheckins = await fetchCheckinsGrouped(allHabits);
                    console.log(`[CHECKINS] Loaded for ${Object.keys(allCheckins).length} habits`);
                } catch (e) {
                    console.log('[CHECKINS] Failed:', e.message);
                    allCheckins = {};
                }

                // Fetch today's pomodoro/timer stats for timer-based habits
                try {
                    const today = new Date();
                    const todayStr = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(today.getDate()).padStart(2, '0')}`;
                    const pData = await fetchPomodoroStats(todayStr, todayStr);
                    pomodoroStats = pData?.taskDurations || {};
                    console.log(`[POMODORO] Timer stats:`, pomodoroStats);
                } catch (e) {
                    console.log('[POMODORO] Skip:', e.message);
                    pomodoroStats = {};
                }

                // Auto-complete timer habits if timer >= goal
                try { await triggerAutoComplete(); } catch (e) { console.log('[AUTO-COMPLETE] Skip:', e.message); }

                const cacheTime = getCacheTime();
                const fetchTime = window.__HABITS_FETCH_TIME__ || cacheTime;
                render();
            } catch (e) {
                console.error('Load error:', e);
                showPasteUI();
            }
        }

        function clearCache() {
            localStorage.removeItem('habits_cache');
            localStorage.removeItem('habits_cache_time');
            localStorage.removeItem('checkins_cache');
            showPasteUI();
        }

        function updateDayStatus() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setHours(24, 0, 0, 0);
            const remainingMs = Math.max(0, tomorrow - now);
            const remainingMinutes = Math.ceil(remainingMs / 60000);
            const hours = Math.floor(remainingMinutes / 60);
            const minutes = remainingMinutes % 60;
            const remainingPercent = Math.max(3, Math.round(remainingMs / 864000));
            const dateLabel = document.getElementById('dayDate');
            const timeLabel = document.getElementById('dayTime');
            const percentLabel = document.getElementById('dayPercent');
            const batteryFill = document.getElementById('dayBatteryFill');

            if (dateLabel) {
                dateLabel.textContent = new Intl.DateTimeFormat('en-GB', {
                    day: 'numeric',
                    month: 'short',
                    year: 'numeric',
                    weekday: 'long'
                }).format(now);
            }
            if (timeLabel) timeLabel.textContent = `Time left: ${hours}h ${String(minutes).padStart(2, '0')}m`;
            if (percentLabel) percentLabel.textContent = `${remainingPercent}% left`;
            if (batteryFill) {
                batteryFill.style.width = `${remainingPercent}%`;
                batteryFill.style.background = remainingPercent < 25 ? '#ef4444' : remainingPercent < 50 ? '#f59e0b' : '#22c55e';
            }
        }

        // Boot
        updateDayStatus();
        window.setInterval(updateDayStatus, 60000);
        window.setInterval(() => updateHabitTimeBudget(budgetHabits), 60000);
        initMobileView();
        restoreHabitFilters();
        refreshData();
        
        // Handle resize (rotation, etc)
        window.addEventListener('resize', () => {
            const leftPanel = document.querySelector('.left-panel');
            const rightPanel = document.querySelector('.right-panel');
            
            if (window.innerWidth > 768) {
                // Desktop: show both panels
                leftPanel.classList.remove('hidden');
                rightPanel.classList.remove('hidden');
            } else {
                // Mobile: respect current toggle state
                if (mobileShowingDetail) {
                    leftPanel.classList.add('hidden');
                    rightPanel.classList.remove('hidden');
                } else {
                    leftPanel.classList.remove('hidden');
                    rightPanel.classList.add('hidden');
                }
            }
        });
    </script>
</body>
</html>
