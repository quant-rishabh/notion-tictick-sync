        // ============ HELPERS ============

        function daysAgo(n) {
            const d = new Date();
            d.setDate(d.getDate() - n);
            return d;
        }

        function getStamp(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return parseInt(`${y}${m}${d}`);
        }

        function stampToDate(stamp) {
            const s = String(stamp);
            return new Date(parseInt(s.slice(0,4)), parseInt(s.slice(4,6)) - 1, parseInt(s.slice(6,8)));
        }

        function todayStamp() { return getStamp(new Date()); }

        function formatDate(date) {
            const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return `${days[date.getDay()]} ${date.getDate()} ${months[date.getMonth()]}`;
        }

        // Parse RRULE to human text
        function parseRepeatRule(rule) {
            if (!rule) return 'Daily';
            if (rule.includes('FREQ=DAILY') && rule.includes('INTERVAL=30')) return 'Monthly';
            if (rule.includes('FREQ=DAILY') && !rule.includes('INTERVAL=')) return 'Daily';
            if (rule.includes('FREQ=DAILY;INTERVAL=1')) return 'Daily';
            if (rule.includes('FREQ=DAILY;INTERVAL=')) {
                const m = rule.match(/INTERVAL=(\d+)/);
                return m ? `Every ${m[1]} days` : 'Daily';
            }
            if (rule.includes('FREQ=WEEKLY')) {
                const timesMatch = rule.match(/TT_TIMES=(\d+)/);
                if (timesMatch) return `${timesMatch[1]}x per week`;
                const dayMatch = rule.match(/BYDAY=([A-Z,]+)/);
                if (dayMatch) {
                    const days = dayMatch[1].split(',');
                    if (days.length === 7) return 'Daily';
                    const shortDays = days.map(d => d.slice(0,2)).join(',');
                    return `${shortDays}`;
                }
                return 'Weekly';
            }
            if (rule.includes('FREQ=MONTHLY')) return 'Monthly';
            return rule;
        }

        // Get cycle length in days from repeatRule
        function getIntervalDays(habit) {
            const rule = habit.repeatRule || '';
            if (rule.includes('FREQ=DAILY;INTERVAL=1')) return 1;
            if (rule.includes('FREQ=DAILY') && !rule.includes('INTERVAL=')) return 1;
            if (rule.includes('FREQ=DAILY;INTERVAL=')) {
                const m = rule.match(/INTERVAL=(\d+)/);
                return m ? parseInt(m[1]) : 1;
            }
            if (rule.includes('FREQ=WEEKLY')) {
                const timesMatch = rule.match(/TT_TIMES=(\d+)/);
                if (timesMatch) return 7 / parseInt(timesMatch[1]);
                const dayMatch = rule.match(/BYDAY=([A-Z,]+)/);
                if (dayMatch) return 7 / dayMatch[1].split(',').length;
                return 7;
            }
            if (rule.includes('FREQ=MONTHLY')) return 30;
            return 1;
        }

        // Get how many times per week this habit expects
        function getExpectedWeeklyFreq(habit) {
            const rule = habit.repeatRule || '';
            if (rule.includes('FREQ=DAILY') && !rule.includes('INTERVAL=')) return 7;
            if (rule.includes('FREQ=DAILY;INTERVAL=1')) return 7;
            if (rule.includes('FREQ=DAILY;INTERVAL=')) {
                const m = rule.match(/INTERVAL=(\d+)/);
                return m ? Math.floor(7 / parseInt(m[1])) : 7;
            }
            if (rule.includes('FREQ=WEEKLY')) {
                const timesMatch = rule.match(/TT_TIMES=(\d+)/);
                if (timesMatch) return parseInt(timesMatch[1]);
                const dayMatch = rule.match(/BYDAY=([A-Z,]+)/);
                if (dayMatch) return dayMatch[1].split(',').length;
                return 1;
            }
            if (rule.includes('FREQ=MONTHLY')) return 0.25; // ~once a month
            return 7; // default daily
        }

        // Day abbreviation → JS getDay() index
        const BYDAY_MAP = { SU: 0, MO: 1, TU: 2, WE: 3, TH: 4, FR: 5, SA: 6 };

        // For FREQ=WEEKLY;BYDAY=xx,yy (NOT TT_TIMES), returns array of day-of-week numbers, else null
        function getByDaySchedule(habit) {
            const rule = habit.repeatRule || '';
            if (!rule.includes('FREQ=WEEKLY')) return null;
            if (rule.includes('TT_TIMES=')) return null; // "3x per week" — no specific days known
            const m = rule.match(/BYDAY=([A-Z,]+)/);
            if (!m) return null;
            return m[1].split(',').map(d => BYDAY_MAP[d]).filter(d => d !== undefined);
        }

        // Returns stamps of scheduled slots in the past windowDays (today included if scheduled), newest first
        function getByDaySlots(scheduledDays, windowDays) {
            const slots = [];
            const now = new Date();
            for (let i = 0; i < windowDays; i++) {
                const d = new Date(now); d.setDate(d.getDate() - i);
                if (scheduledDays.includes(d.getDay())) slots.push(getStamp(d));
            }
            return slots;
        }

        // Calculate streak for a habit
        function calcStreak(habitId) {
            const checkins = allCheckins[habitId] || [];
            if (checkins.length === 0) return 0;

            // Sort by stamp descending
            const stamps = checkins
                .filter(c => c.status === 2)
                .map(c => c.checkinStamp)
                .sort((a, b) => b - a);

            if (stamps.length === 0) return 0;

            // Count consecutive days from today backwards
            let streak = 0;
            let checkDate = new Date();
            
            for (let i = 0; i < 90; i++) {
                const stamp = getStamp(checkDate);
                if (stamps.includes(stamp)) {
                    streak++;
                } else if (i > 0) {
                    // Allow today to be unchecked (day not over yet)
                    break;
                }
                checkDate.setDate(checkDate.getDate() - 1);
            }
            return streak;
        }

        // Get habit age in days (capped, min 1)
        function getHabitAge(habit) {
            const created = new Date(habit.createdTime);
            const now = new Date();
            return Math.max(1, Math.floor((now - created) / 86400000));
        }

        // Determine habit health status (age-aware)
        function getHabitStatus(habit) {
            if (habit.status === 1) return 'archived';
            
            const checkins = allCheckins[habit.id] || [];
            // Done today → always active, regardless of window math
            if (checkins.some(c => c.status === 2 && c.checkinStamp === getStamp(new Date()))) return 'active';
            const now = new Date();
            const ageDays = getHabitAge(habit);
            const windowDays = Math.min(ageDays, 7);
            const stamps = [];
            for (let i = 0; i < windowDays; i++) {
                const d = new Date(now);
                d.setDate(d.getDate() - i);
                stamps.push(getStamp(d));
            }

            const weeklyExpected = getExpectedWeeklyFreq(habit);
            const expected = weeklyExpected * windowDays / 7;
            const done = checkins.filter(c => c.status === 2 && stamps.includes(c.checkinStamp)).length;
            const ratio = expected > 0 ? done / expected : 0;

            if (ratio >= 0.6) return 'active';
            if (ratio >= 0.3) return 'slipping';
            return 'dying';
        }

        // Get letter grade from percentage
        function getGrade(pct) {
            if (pct >= 80) return 'A';
            if (pct >= 60) return 'B';
            if (pct >= 40) return 'C';
            if (pct >= 20) return 'D';
            return 'F';
        }

        // Calculate best streak for a habit
        function calcBestStreak(habitId) {
            const checkins = allCheckins[habitId] || [];
            const stamps = checkins.filter(c => c.status === 2).map(c => c.checkinStamp).sort();
            let best = 0, curr = 0;
            for (let i = 0; i < stamps.length; i++) {
                if (i === 0) { curr = 1; }
                else {
                    const prev = stampToDate(stamps[i-1]);
                    const now = stampToDate(stamps[i]);
                    curr = Math.round((now - prev) / 86400000) === 1 ? curr + 1 : 1;
                }
                if (curr > best) best = curr;
            }
            return best;
        }

        // Check if habit matches a project (for challenge linking)
        // Only match if the project name IS the habit name (or very close), not substring
        function findMatchingProject(habit) {
            const habitName = habit.name.toLowerCase().replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();
            return allProjects.find(p => {
                const projName = p.name.toLowerCase().replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();
                // Exact match or one is a very close prefix (within 5 chars difference)
                return projName === habitName 
                    || (habitName.startsWith(projName) && habitName.length - projName.length < 5)
                    || (projName.startsWith(habitName) && projName.length - habitName.length < 5);
            });
        }

        // Calculate urgency score (higher = more neglected)
        // urgency = (1 - done/7) + daysSinceLast/interval
        // All habits measured over last 7 cycles for fair comparison
        function calcUrgency(habit) {
            if (habit.status === 1) return 0;
            const checkins = allCheckins[habit.id] || [];
            const now = new Date();
            const ageDays = getHabitAge(habit);
            const intervalDays = getIntervalDays(habit);

            // Last 7 cycles window (capped to habit age)
            const numCycles = 7;
            const windowDays = Math.min(Math.round(intervalDays * numCycles), ageDays);
            const expected = Math.min(numCycles, Math.floor(ageDays / intervalDays));

            // Count done in window
            const windowStamps = [];
            for (let i = 0; i < windowDays; i++) {
                const d = new Date(now); d.setDate(d.getDate() - i);
                windowStamps.push(getStamp(d));
            }
            const done = checkins.filter(c => c.status === 2 && windowStamps.includes(c.checkinStamp)).length;
            const doneStamps = checkins.filter(c => c.status === 2).map(c => c.checkinStamp).sort((a, b) => b - a);

            // consistency: 1 - done/expected (0=perfect, 1=completely missing)
            const consistency = expected > 0 ? Math.max(0, 1 - done / expected) : 0;

            // BYDAY habits (exact scheduled days, not "Nx per week"): use slot-based counting
            const scheduledDays = getByDaySchedule(habit);
            if (scheduledDays) {
                const slots = getByDaySlots(scheduledDays, windowDays);
                const slotsExpected = Math.max(1, slots.length);
                const slotsDone = checkins.filter(c => c.status === 2 && slots.includes(c.checkinStamp)).length;
                const byConsistency = Math.max(0, 1 - slotsDone / slotsExpected);
                const slotsSinceLast = doneStamps.length > 0
                    ? slots.filter(s => s > doneStamps[0]).length
                    : slotsExpected;
                const byUrgency = byConsistency + slotsSinceLast;
                const bar = '█'.repeat(Math.min(20, Math.round(byUrgency))) + '░'.repeat(Math.max(0, 20 - Math.round(byUrgency)));
                const tag = byUrgency >= 10 ? '🔴' : byUrgency >= 3 ? '🟡' : '🟢';
                console.log(
                    `${tag} %-40s  urgency=%s  |${bar}|\n` +
                    `   age=${ageDays}d  [BYDAY] slots=${slotsDone}/${slotsExpected}  slotsMissed=${slotsSinceLast}` +
                    `  consistency=${byConsistency.toFixed(2)}`,
                    habit.name.slice(0, 40), byUrgency.toFixed(2)
                );
                return byUrgency;
            }

            // starvation: how many full cycles since you last did it (unbounded)
            let daysSinceLast;
            if (doneStamps.length > 0) {
                const lastDate = stampToDate(doneStamps[0]);
                daysSinceLast = Math.max(0, Math.floor((now - lastDate) / 86400000));
            } else {
                daysSinceLast = ageDays; // no stamps → assume never done in known history
            }
            daysSinceLast = Math.min(daysSinceLast, ageDays);
            const starvation = daysSinceLast / intervalDays;

            const urgency = consistency + starvation;
            const bar = '█'.repeat(Math.min(20, Math.round(urgency))) + '░'.repeat(Math.max(0, 20 - Math.round(urgency)));
            const tag = urgency >= 10 ? '🔴' : urgency >= 3 ? '🟡' : '🟢';
            console.log(
                `${tag} %-40s  urgency=%s  |${bar}|\n` +
                `   age=${ageDays}d  cycle=${intervalDays.toFixed(1)}d  7cycles=${windowDays}d  done=${done}/${expected}` +
                `  last=${daysSinceLast === 0 ? 'today' : daysSinceLast + 'd ago'}` +
                `  consistency=${consistency.toFixed(2)}  starvation=${starvation.toFixed(2)}`,
                habit.name.slice(0, 40), urgency.toFixed(2)
            );

            return urgency;
        }

        // Get age-aware monthly score
        function getMonthlyScore(habit) {
            const checkins = allCheckins[habit.id] || [];
            const ageDays = getHabitAge(habit);
            const windowDays = Math.min(ageDays, 30);
            const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - windowDays);
            const done = checkins.filter(c => {
                const d = stampToDate(c.checkinStamp);
                return c.status === 2 && d >= cutoff;
            }).length;
            const expected = Math.max(1, Math.round(getExpectedWeeklyFreq(habit) * windowDays / 7));
            const pct = Math.min(100, Math.round((done / expected) * 100));
            return { done, expected, pct, windowDays };
        }

        // ============ STATUS & DISPLAY HELPERS ============

        // Human-readable status tag for a habit
        function getStatusTag(habit) {
            const checkins = allCheckins[habit.id] || [];
            const today = todayStamp();
            const todayDone = checkins.some(c => c.checkinStamp === today && c.status === 2);
            if (todayDone) return { text: 'Done ✅', cls: 'done', color: '#10b981' };
            if (habit._status === 'archived') return { text: 'Archived', cls: 'on-track', color: '#666' };

            const intervalDays = habit._intervalDays || getIntervalDays(habit);
            const daysSince = habit._daysSinceLast || 0;
            const streak = habit._streak || 0;

            if (daysSince > intervalDays * 1.5) {
                const overdueDays = Math.round(daysSince - intervalDays);
                return { text: `${overdueDays}d overdue`, cls: 'overdue', color: '#ef4444' };
            }
            if (streak >= 3 && daysSince >= intervalDays * 0.8) {
                return { text: 'Streak at risk!', cls: 'streak-risk', color: '#f59e0b' };
            }
            if (daysSince > intervalDays) {
                return { text: 'Falling behind', cls: 'overdue', color: '#f59e0b' };
            }
            if (daysSince >= intervalDays * 0.8) {
                return { text: 'Due today', cls: 'due', color: '#fcd34d' };
            }
            if (intervalDays > 7 && daysSince < intervalDays * 0.5) {
                const daysLeft = Math.round(intervalDays - daysSince);
                return { text: `Due in ${daysLeft}d`, cls: 'on-track', color: '#10b981' };
            }
            return { text: 'On track', cls: 'on-track', color: '#10b981' };
        }

        // Get streak with frequency-appropriate unit
        function getStreakWithUnit(habit) {
            const streak = habit._streak || 0;
            const interval = habit._intervalDays || getIntervalDays(habit);
            if (interval <= 1.5) return { count: streak, unit: streak === 1 ? 'day' : 'days' };
            if (interval <= 10) return { count: streak, unit: streak === 1 ? 'day' : 'days' };
            if (interval <= 45) {
                const months = Math.floor(streak / 30);
                if (months > 0) return { count: months, unit: months === 1 ? 'month' : 'months' };
                return { count: streak, unit: streak === 1 ? 'day' : 'days' };
            }
            return { count: streak, unit: streak === 1 ? 'day' : 'days' };
        }

        // Get progress for N cycles back
        function getCycleProgress(habit, numCycles) {
            const checkins = allCheckins[habit.id] || [];
            const interval = habit._intervalDays || getIntervalDays(habit);
            const windowDays = Math.round(interval * numCycles);
            const now = new Date();
            const stamps = [];
            for (let i = 0; i < windowDays; i++) {
                const d = new Date(now); d.setDate(d.getDate() - i);
                stamps.push(getStamp(d));
            }
            const done = checkins.filter(c => c.status === 2 && stamps.includes(c.checkinStamp)).length;
            const pct = numCycles > 0 ? Math.min(100, Math.round((done / numCycles) * 100)) : 0;
            return { done, expected: numCycles, pct, windowDays };
        }

        // Get adaptive progress windows based on frequency
        function getAdaptiveWindows(habit) {
            const interval = habit._intervalDays || getIntervalDays(habit);
            const ageDays = getHabitAge(habit);
            const fetchedLookback = interval > 7 ? Math.min(Math.round(interval * 3), 365) : 30;
            const maxCycles = Math.floor(Math.min(ageDays, fetchedLookback) / interval);

            if (interval <= 1.5) {
                return [
                    { label: 'Today', cycles: 1 },
                    { label: 'Last 7 days', cycles: Math.min(7, maxCycles) },
                    { label: 'Last 30 days', cycles: Math.min(30, maxCycles) },
                ].filter(w => w.cycles >= 1);
            }
            if (interval <= 5) {
                return [
                    { label: 'This week', cycles: Math.min(Math.round(7 / interval), maxCycles) },
                    { label: 'Last 4 weeks', cycles: Math.min(Math.round(28 / interval), maxCycles) },
                    { label: 'Last 7 weeks', cycles: Math.min(Math.round(49 / interval), maxCycles) },
                ].filter(w => w.cycles >= 1);
            }
            if (interval <= 10) {
                return [
                    { label: 'This week', cycles: 1 },
                    { label: 'Last 7 weeks', cycles: Math.min(7, maxCycles) },
                    { label: 'Last 12 weeks', cycles: Math.min(12, maxCycles) },
                ].filter(w => w.cycles >= 1);
            }
            if (interval <= 45) {
                return [
                    { label: 'This month', cycles: 1 },
                    { label: 'Last 3 months', cycles: Math.min(3, maxCycles) },
                    { label: 'Last 7 months', cycles: Math.min(7, maxCycles) },
                ].filter(w => w.cycles >= 1);
            }
            return [
                { label: 'This cycle', cycles: 1 },
                { label: 'Last 4 cycles', cycles: Math.min(4, maxCycles) },
                { label: 'Last 7 cycles', cycles: Math.min(7, maxCycles) },
            ].filter(w => w.cycles >= 1);
        }

        // Build GitHub-style day heatmap
        function buildDayHeatmap(habit, numWeeks) {
            const checkins = allCheckins[habit.id] || [];
            const doneStamps = new Set(checkins.filter(c => c.status === 2).map(c => c.checkinStamp));
            const today = new Date();
            const todayS = todayStamp();
            const totalDays = numWeeks * 7;

            let html = '<div class="gh-heatmap">';
            for (let i = totalDays - 1; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(today.getDate() - i);
                const stamp = getStamp(d);
                const isToday = stamp === todayS;
                const isBeforeCreation = d < new Date(habit.createdTime);

                if (isBeforeCreation) {
                    html += '<div class="gh-cell empty"></div>';
                } else {
                    const done = doneStamps.has(stamp);
                    html += `<div class="gh-cell ${done ? 'done' : 'missed'}${isToday ? ' today' : ''}"><div class="gh-tip">${formatDate(d)}${done ? ' ✅' : ''}</div></div>`;
                }
            }
            html += '</div>';
            return html;
        }

        // Build cycle-based view (week or month rows)
        function buildCycleView(habit, mode, count) {
            const checkins = allCheckins[habit.id] || [];
            const doneStamps = checkins.filter(c => c.status === 2).map(c => c.checkinStamp);
            const now = new Date();
            let html = '';

            if (mode === 'week') {
                const weekExpected = Math.max(1, Math.ceil(getExpectedWeeklyFreq(habit)));
                for (let w = 0; w < count; w++) {
                    const stamps = [];
                    for (let d = 0; d < 7; d++) {
                        const dt = new Date(now); dt.setDate(dt.getDate() - (w * 7 + d));
                        stamps.push(getStamp(dt));
                    }
                    const done = doneStamps.filter(s => stamps.includes(s)).length;
                    const pct = Math.min(100, Math.round((done / weekExpected) * 100));
                    const color = pct >= 100 ? '#10b981' : pct >= 50 ? '#f59e0b' : (done === 0 ? '#e0e0e0' : '#ef4444');
                    const label = w === 0 ? 'This week' : w === 1 ? 'Last week' : `${w}w ago`;
                    html += `<div class="cycle-row">
                        <div class="cycle-label">${label}</div>
                        <div class="cycle-bar"><div class="cycle-bar-fill" style="width:${pct}%;background:${color}"></div></div>
                        <div class="cycle-val">${done}/${weekExpected}</div>
                        <div class="cycle-check">${pct >= 100 ? '✅' : ''}</div>
                    </div>`;
                }
            } else if (mode === 'month') {
                for (let m = 0; m < count; m++) {
                    const monthDate = new Date(now.getFullYear(), now.getMonth() - m, 1);
                    const monthEnd = new Date(now.getFullYear(), now.getMonth() - m + 1, 0);
                    const monthStamps = [];
                    for (let d = 1; d <= monthEnd.getDate(); d++) {
                        const dt = new Date(monthDate.getFullYear(), monthDate.getMonth(), d);
                        if (dt <= now) monthStamps.push(getStamp(dt));
                    }
                    const done = doneStamps.filter(s => monthStamps.includes(s)).length;
                    const monthExpected = Math.max(1, Math.round(getExpectedWeeklyFreq(habit) * monthStamps.length / 7));
                    const pct = Math.min(100, Math.round((done / monthExpected) * 100));
                    const color = pct >= 80 ? '#10b981' : pct >= 50 ? '#f59e0b' : (done === 0 ? '#e0e0e0' : '#ef4444');
                    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                    const label = m === 0 ? 'This month' : `${months[monthDate.getMonth()]} '${String(monthDate.getFullYear()).slice(2)}`;
                    html += `<div class="cycle-row">
                        <div class="cycle-label">${label}</div>
                        <div class="cycle-bar"><div class="cycle-bar-fill" style="width:${pct}%;background:${color}"></div></div>
                        <div class="cycle-val">${done}/${monthExpected}</div>
                        <div class="cycle-check">${pct >= 80 ? '✅' : ''}</div>
                    </div>`;
                }
            }
            return html;
        }

        // Build history bar chart
        function buildHistoryChart(habit, mode) {
            const checkins = allCheckins[habit.id] || [];
            const doneStamps = checkins.filter(c => c.status === 2).map(c => c.checkinStamp);
            const now = new Date();
            const bars = [];

            const ageDays = getHabitAge(habit);

            if (mode === 'day') {
                const dayCount = Math.min(ageDays, 365);
                for (let i = dayCount - 1; i >= 0; i--) {
                    const d = new Date(now); d.setDate(d.getDate() - i);
                    const stamp = getStamp(d);
                    const done = doneStamps.includes(stamp) ? 1 : 0;
                    bars.push({ value: done, max: 1, label: formatDate(d) });
                }
            } else if (mode === 'week') {
                const weekExp = Math.max(1, Math.ceil(getExpectedWeeklyFreq(habit)));
                const weekCount = Math.min(52, Math.ceil(ageDays / 7));
                for (let w = weekCount - 1; w >= 0; w--) {
                    const stamps = [];
                    for (let d = 0; d < 7; d++) {
                        const dt = new Date(now); dt.setDate(dt.getDate() - (w * 7 + d));
                        stamps.push(getStamp(dt));
                    }
                    const done = doneStamps.filter(s => stamps.includes(s)).length;
                    bars.push({ value: done, max: weekExp, label: w === 0 ? 'This week' : w === 1 ? 'Last week' : `${w}w ago` });
                }
            } else if (mode === 'month') {
                const monthCount = Math.min(12, Math.ceil(ageDays / 30));
                for (let m = monthCount - 1; m >= 0; m--) {
                    const monthDate = new Date(now.getFullYear(), now.getMonth() - m, 1);
                    const monthEnd = new Date(now.getFullYear(), now.getMonth() - m + 1, 0);
                    const monthStamps = [];
                    for (let d = 1; d <= monthEnd.getDate(); d++) {
                        const dt = new Date(monthDate.getFullYear(), monthDate.getMonth(), d);
                        if (dt <= now) monthStamps.push(getStamp(dt));
                    }
                    const done = doneStamps.filter(s => monthStamps.includes(s)).length;
                    const monthExp = Math.max(1, Math.round(getExpectedWeeklyFreq(habit) * monthStamps.length / 7));
                    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                    bars.push({ value: done, max: monthExp, label: months[monthDate.getMonth()] });
                }
            }

            const maxVal = Math.max(1, ...bars.map(b => b.value));
            let html = '<div class="history-bars">';
            for (const bar of bars) {
                const heightPct = Math.max(3, (bar.value / maxVal) * 100);
                const pct = bar.max > 0 ? Math.round((bar.value / bar.max) * 100) : 0;
                const color = bar.value === 0 ? '#e8e8e8' : (pct >= 80 ? '#10b981' : pct >= 50 ? '#f59e0b' : '#ef4444');
                html += `<div class="h-bar" style="height:${heightPct}%;background:${color}"><div class="h-tip">${bar.label}: ${bar.value}${bar.max > 1 ? '/' + bar.max : ''}</div></div>`;
            }
            html += '</div>';
            return html;
        }

        // Heatmap tab switching
        function switchHeatmap(view) {
            document.querySelectorAll('.heatmap-tabs .view-tab').forEach(t => t.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
            ['Day','Week','Month'].forEach(v => {
                const el = document.getElementById('heatmap' + v);
                if (el) el.style.display = v.toLowerCase() === view ? 'block' : 'none';
            });
        }

        // History tab switching
        function switchHistory(view) {
            document.querySelectorAll('.history-tabs .view-tab').forEach(t => t.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
            const habit = renderedHabits.find(h => h.id === selectedHabitId);
            if (habit) {
                document.getElementById('historyContainer').innerHTML = buildHistoryChart(habit, view);
            }
        }

        function showError(msg) {
            document.getElementById('habitContainer').innerHTML = `<div class="no-data">⚠️ ${msg}</div>`;
        }

        // ============ RENDER ============

        function render() {
            const container = document.getElementById('habitContainer');
            
            let habits = allHabits.map(h => {
                const mapped = {
                    ...h,
                    _status: getHabitStatus(h),
                    _streak: calcStreak(h.id),
                    _project: findMatchingProject(h),
                    _weeklyExpected: getExpectedWeeklyFreq(h),
                    _intervalDays: getIntervalDays(h)
                };
                mapped._urgency = calcUrgency(h);
                const dStamps = (allCheckins[h.id] || []).filter(c => c.status === 2).map(c => c.checkinStamp).sort((a,b)=>b-a);
                let rawDaysSince;
                if (dStamps.length > 0) {
                    rawDaysSince = Math.max(0, Math.floor((new Date() - stampToDate(dStamps[0])) / 86400000));
                } else {
                    rawDaysSince = getHabitAge(h); // no stamps → use habit age
                }
                mapped._daysSinceLast = Math.min(rawDaysSince, getHabitAge(h));
                mapped._outsideWindow = dStamps.length === 0 && h.totalCheckIns > 0;
                mapped._overdueDays = Math.max(0, mapped._daysSinceLast - mapped._intervalDays);
                // Consistency: 1 = never done, 0 = perfect (done/expected from last 7 cycles)
                const cp = getCycleProgress(mapped, 7);
                mapped._consistency = cp.expected > 0 ? Math.max(0, 1 - cp.done / cp.expected) : 0;
                return mapped;
            });

            // Stats
            const activeHabits = habits.filter(h => h._status !== 'archived');
            const statusCounts = { active: 0, slipping: 0, dying: 0 };
            activeHabits.forEach(h => statusCounts[h._status]++);
            
            const todaysDone = activeHabits.filter(h => {
                const checkins = allCheckins[h.id] || [];
                return checkins.some(c => c.checkinStamp === todayStamp() && c.status === 2);
            }).length;

            const bestStreak = Math.max(0, ...habits.map(h => h._streak));

            // Focus summary
            const overdueCount = activeHabits.filter(h => h._daysSinceLast > h._intervalDays * 1.5).length;
            const dueTodayCount = activeHabits.filter(h => {
                const done = (allCheckins[h.id]||[]).some(c => c.checkinStamp === todayStamp() && c.status === 2);
                return !done && h._daysSinceLast >= h._intervalDays * 0.8;
            }).length;
            const streaksAtRisk = activeHabits.filter(h => {
                const done = (allCheckins[h.id]||[]).some(c => c.checkinStamp === todayStamp() && c.status === 2);
                return !done && h._streak >= 3 && h._daysSinceLast >= h._intervalDays * 0.8;
            }).length;

            let summaryHtml = `<div class="focus-chip"><strong>${todaysDone}/${activeHabits.length}</strong> done today</div>`;
            if (overdueCount > 0) summaryHtml += `<div class="focus-chip alert">⚠️ <strong>${overdueCount}</strong> overdue</div>`;
            if (dueTodayCount > 0) summaryHtml += `<div class="focus-chip warn">📅 <strong>${dueTodayCount}</strong> due today</div>`;
            if (streaksAtRisk > 0) summaryHtml += `<div class="focus-chip warn">🔥 <strong>${streaksAtRisk}</strong> streak${streaksAtRisk > 1 ? 's' : ''} at risk</div>`;
            document.getElementById('focusSummary').innerHTML = summaryHtml;

            // Filter
            let filtered = habits;
            if (currentFilter === 'active') filtered = habits.filter(h => h._status === 'active');
            else if (currentFilter === 'slipping') filtered = habits.filter(h => h._status === 'slipping');
            else if (currentFilter === 'dying') filtered = habits.filter(h => h._status === 'dying');
            else if (currentFilter === 'archived') filtered = habits.filter(h => h._status === 'archived');
            else if (currentFilter === 'challenge') filtered = habits.filter(h => h._project && h._status !== 'archived');
            else filtered = habits.filter(h => h._status !== 'archived');

            // Sort: tier 1 = overdue days DESC, tier 2 = consistency DESC (worst first)
            filtered.sort((a, b) => {
                if (a._status === 'archived' && b._status !== 'archived') return 1;
                if (b._status === 'archived' && a._status !== 'archived') return -1;
                if (Math.abs(b._overdueDays - a._overdueDays) > 0.5) return b._overdueDays - a._overdueDays;
                if (Math.abs(b._consistency - a._consistency) > 0.01) return b._consistency - a._consistency;
                return b._daysSinceLast - a._daysSinceLast;
            });

            renderedHabits = filtered;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-data">No habits found for this filter</div>`;
                return;
            }

            container.innerHTML = filtered.map(h => renderHabitItem(h)).join('');

            // Auto-select first if nothing selected or selected not in list
            if (!selectedHabitId || !filtered.find(h => h.id === selectedHabitId)) {
                selectHabit(filtered[0].id);
            } else {
                selectHabit(selectedHabitId);
            }
        }

        // Detect if a unit is time-based (hour/hours/Hour/min/minute/minutes etc.)
        function isTimerUnit(unit) {
            if (!unit) return false;
            return /^(hour|hours|hr|hrs|minute|minutes|min|mins)$/i.test(unit.trim());
        }
        function isHourUnit(unit) {
            if (!unit) return false;
            return /^(hour|hours|hr|hrs)$/i.test(unit.trim());
        }

        // Timer progress bar for habits with time-based units
        // Uses pomodoro stats (actual timer minutes today) not checkin value
        function renderTimerProgress(habit, todayCheckin) {
            if (!isTimerUnit(habit.unit)) return '';
            const goal = habit.goal || 1;
            const timerMinutes = pomodoroStats[habit.name] || 0;
            const goalMinutes = isHourUnit(habit.unit) ? goal * 60 : goal;
            const pct = Math.min(100, Math.round((timerMinutes / goalMinutes) * 100));
            const isComplete = timerMinutes >= goalMinutes;

            // Format display
            const displayValue = timerMinutes >= 60 ? `${Math.floor(timerMinutes/60)}h ${timerMinutes%60}m` : `${timerMinutes}m`;
            const displayGoal = goalMinutes >= 60 ? `${Math.floor(goalMinutes/60)}h${goalMinutes%60 > 0 ? ' ' + goalMinutes%60 + 'm' : ''}` : `${goalMinutes}m`;

            const barColor = isComplete ? '#10b981' : pct >= 50 ? '#f59e0b' : '#3b82f6';
            return `
                <div class="timer-progress">
                    <div class="timer-progress-header">
                        <span>⏱️ ${displayValue} / ${displayGoal}</span>
                        <span style="color:${barColor};font-weight:600">${isComplete ? '✓ Done' : pct + '%'}</span>
                    </div>
                    <div class="timer-progress-bar">
                        <div class="timer-progress-fill" style="width:${pct}%;background:${barColor}"></div>
                    </div>
                </div>`;
        }

        function renderHabitItem(habit) {
            const checkins = allCheckins[habit.id] || [];
            const today = todayStamp();
            const todayCheckin = checkins.find(c => c.checkinStamp === today);
            const todayDone = todayCheckin && todayCheckin.status === 2;
            const status = getStatusTag(habit);
            const streakInfo = getStreakWithUnit(habit);

            // Build 7 cycle dots (most recent on right)
            const interval = habit._intervalDays || 1;
            const doneStamps = new Set(checkins.filter(c => c.status === 2).map(c => c.checkinStamp));
            const now = new Date();
            const ageDays = getHabitAge(habit);
            let dotsHtml = '';
            let doneCount = 0;
            for (let i = 6; i >= 0; i--) {
                // Each cycle: check if any checkin exists in that cycle's window
                const cycleStart = Math.round(i * interval);
                const cycleEnd = Math.round((i + 1) * interval);
                if (cycleStart >= ageDays) {
                    dotsHtml += '<div class="cycle-dot future"></div>';
                    continue;
                }
                let hasDone = false;
                for (let d = cycleStart; d < cycleEnd; d++) {
                    const dt = new Date(now); dt.setDate(dt.getDate() - d);
                    if (doneStamps.has(getStamp(dt))) { hasDone = true; break; }
                }
                if (hasDone) doneCount++;
                dotsHtml += `<div class="cycle-dot ${hasDone ? 'done' : 'missed'}"></div>`;
            }

            const isSelected = habit.id === selectedHabitId;
            const isTimer = isTimerUnit(habit.unit);
            const typeBadge = isTimer ? '<span class="habit-type-badge timer">⏱️ Timer</span>' : '<span class="habit-type-badge checkin">✓ Check-in</span>';

            return `
            <div class="habit-item ${habit._status} ${isSelected ? 'selected' : ''}" onclick="selectHabit('${habit.id}')">
                <div class="habit-item-header">
                    <div class="habit-item-name">${todayDone ? '✅' : '⬜'} ${habit.name}</div>
                    <div class="habit-item-right">
                        ${typeBadge}
                        <span class="status-tag" style="background:${status.color}22;color:${status.color}">${status.text}</span>
                    </div>
                </div>
                <div class="habit-item-meta">
                    <span>🔄 ${parseRepeatRule(habit.repeatRule)}</span>
                    <span>🔥 ${streakInfo.count} ${streakInfo.unit}</span>
                </div>
                <div class="cycle-dots">
                    ${dotsHtml}
                    <span style="font-size:9px;color:#666;margin-left:4px">${doneCount}/7</span>
                </div>
                ${renderTimerProgress(habit, todayCheckin)}
            </div>`;
        }

        function selectHabit(habitId) {
            selectedHabitId = habitId;
            // Update selection highlight
            document.querySelectorAll('.habit-item').forEach(el => el.classList.remove('selected'));
            const items = document.querySelectorAll('.habit-item');
            items.forEach(el => {
                if (el.getAttribute('onclick')?.includes(habitId)) el.classList.add('selected');
            });
            renderDetail();
            showDetailOnMobile(); // Auto-switch to detail on mobile
        }

        function renderDetail() {
            const panel = document.getElementById('detailPanel');
            const habit = renderedHabits.find(h => h.id === selectedHabitId);
            if (!habit) {
                panel.innerHTML = '<div class="detail-empty">← Click a habit to see analysis</div>';
                return;
            }

            const checkins = allCheckins[habit.id] || [];
            const today = todayStamp();
            const todayDone = checkins.some(c => c.checkinStamp === today && c.status === 2);
            const ageDays = getHabitAge(habit);
            const intervalDays = habit._intervalDays;
            const status = getStatusTag(habit);
            const streakInfo = getStreakWithUnit(habit);
            const bestStreak = calcBestStreak(habit.id);
            const streakGap = bestStreak - habit._streak;
            const streakColor = habit._streak >= 7 ? '#10b981' : habit._streak >= 3 ? '#f59e0b' : '#ef4444';

            // ── Weekly stats (for nudge/trend) ──
            const weekWindow = Math.min(ageDays, 7);
            const weekCutoff = new Date(); weekCutoff.setDate(weekCutoff.getDate() - weekWindow);
            const weekCheckins = checkins.filter(c => {
                const d = stampToDate(c.checkinStamp);
                return c.status === 2 && d >= weekCutoff;
            }).length;
            const weekExpected = Math.max(1, Math.ceil(getExpectedWeeklyFreq(habit) * weekWindow / 7));

            // ── Nudge ──
            let nudge = '';
            if (todayDone) {
                nudge = `✅ <strong>Done today!</strong> `;
                if (habit._streak >= 3) nudge += `You're on a ${streakInfo.count}-${streakInfo.unit} streak — keep it going!`;
                else nudge += `Great start. Come back tomorrow to build your streak!`;
                if (habit._streak > 0 && habit._streak >= bestStreak) nudge += ` 🏆 <strong>New record!</strong>`;
            } else if (habit._streak >= 3 && streakGap <= 3 && streakGap > 0) {
                nudge = `🔥 Your <strong>${streakInfo.count}-${streakInfo.unit} streak</strong> is at risk! Do it now — only <strong>${streakGap} more</strong> to beat your best of ${bestStreak}!`;
            } else if (habit._streak >= 3) {
                nudge = `🔥 You have a <strong>${streakInfo.count}-${streakInfo.unit} streak</strong> going. Don't break it — check in today!`;
            } else if (habit._streak === 0 && habit._daysSinceLast > intervalDays * 2) {
                nudge = `💡 <strong>Start fresh today.</strong> One check-in is all it takes to begin a new streak.`;
            } else {
                const newStreak = habit._streak + 1;
                nudge = `💡 <strong>Do it now</strong> → streak goes to <strong>${newStreak}</strong>.`;
                if (newStreak >= bestStreak && bestStreak > 0) nudge += ` 🏆 That ties your record!`;
                else if (streakGap > 0 && streakGap <= 5) nudge += ` Only ${streakGap} more to beat your best!`;
            }

            // ── Progress bars ──
            const windows = getAdaptiveWindows(habit);
            let progressHtml = '';
            for (const w of windows) {
                const prog = getCycleProgress(habit, w.cycles);
                const color = prog.pct >= 80 ? '#10b981' : prog.pct >= 50 ? '#f59e0b' : '#ef4444';
                const doneText = prog.done > 0 && w.cycles === 1 ? `${prog.done}/${prog.expected} ✅` : `${prog.done}/${prog.expected}`;
                const pctText = w.cycles > 1 ? `${prog.pct}%` : '';
                const barText = prog.pct > 15 ? `${prog.pct}%` : '';
                progressHtml += `
                    <div class="progress-row">
                        <div class="progress-label">${w.label}</div>
                        <div class="progress-bar-wrap">
                            <div class="progress-bar-fill-inner" style="width:${prog.pct}%;background:${color}"></div>
                            <div class="progress-bar-text">${barText}</div>
                        </div>
                        <div class="progress-val">${doneText} ${pctText ? '<span class="progress-pct">' + pctText + '</span>' : ''}</div>
                    </div>`;
            }

            // ── Trend ──
            const lastWeekStamps = [];
            for (let i = 7; i < Math.min(14, 7 + ageDays); i++) { const d = new Date(); d.setDate(d.getDate() - i); lastWeekStamps.push(getStamp(d)); }
            const lastWeekDone = checkins.filter(c => c.status === 2 && lastWeekStamps.includes(c.checkinStamp)).length;
            const lastWeekExp = Math.max(1, Math.ceil(getExpectedWeeklyFreq(habit) * lastWeekStamps.length / 7));
            const thisWeekPct = Math.round((weekCheckins / weekExpected) * 100);
            const lastWeekPct = Math.round((lastWeekDone / lastWeekExp) * 100);
            const trendDiff = thisWeekPct - lastWeekPct;
            const trendIcon = trendDiff > 5 ? '↑' : trendDiff < -5 ? '↓' : '→';
            const trendColor = trendDiff > 5 ? '#10b981' : trendDiff < -5 ? '#ef4444' : '#f59e0b';
            const trendText = (trendDiff > 0 ? '+' : '') + trendDiff + '% vs last week';
            let milestone = '';
            if (habit._streak > 0 && habit._streak >= bestStreak) milestone = '🏆 Longest streak ever!';

            // ── Heatmap ── (show full history up to 1 year)
            const defaultView = intervalDays <= 1.5 ? 'day' : intervalDays <= 10 ? 'week' : 'month';
            const heatmapWeeks = Math.min(52, Math.ceil(Math.min(ageDays, 365) / 7));
            const dayHeatmapHtml = buildDayHeatmap(habit, heatmapWeeks);
            const weekViewHtml = buildCycleView(habit, 'week', Math.min(52, Math.ceil(ageDays / 7)));
            const monthViewHtml = buildCycleView(habit, 'month', Math.min(12, Math.ceil(ageDays / 30)));

            // ── History chart ──
            const historyHtml = buildHistoryChart(habit, defaultView);

            // ── Coach tip ──
            const monthly = getMonthlyScore(habit);
            let coachTip = '';
            if (habit._streak > 0 && streakGap > 0 && streakGap <= 3) {
                coachTip = `🔥 You're <strong>${streakGap} ${streakInfo.unit}</strong> away from beating your all-time record of ${bestStreak}!`;
            } else if (trendDiff < -10) {
                coachTip = `📉 You dropped ${Math.abs(trendDiff)}% from last week. Pick just one day to get back on track.`;
            } else if (trendDiff > 10) {
                coachTip = `📈 Up ${trendDiff}% this week — you're building real momentum!`;
            } else if (monthly.pct >= 80) {
                coachTip = `🏆 <strong>${monthly.done}/${monthly.expected}</strong> this month — crushing it! ${habit._streak >= 7 ? "Don't break the chain!" : 'Push for a 7+ day streak!'}`;
            } else if (monthly.pct < 30 && ageDays > 14) {
                coachTip = `💡 Start small — just do it today. One day starts a streak. That streak builds the habit.`;
            } else {
                const dayOfWeekCounts = [0,0,0,0,0,0,0];
                checkins.filter(c => c.status === 2).forEach(c => { dayOfWeekCounts[stampToDate(c.checkinStamp).getDay()]++; });
                const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
                const maxDayCount = Math.max(1, ...dayOfWeekCounts);
                const strongDays = dayNames.filter((_, i) => dayOfWeekCounts[i] >= maxDayCount * 0.6);
                if (strongDays.length > 0 && strongDays.length < 5) {
                    coachTip = `💪 You're strongest on <strong>${strongDays.join(' & ')}</strong>. Use that momentum on other days too.`;
                } else {
                    coachTip = `💡 Consistency beats intensity. Show up today, even if it's less than your target.`;
                }
            }

            // ── Goal info ──
            let goalInfo = '';
            if (habit.type === 'Real' && habit.goal > 1) goalInfo = `🎯 ${habit.goal} ${habit.unit || ''} per day`;
            if (habit.targetDays > 0) goalInfo += (goalInfo ? ' · ' : '') + `📅 ${habit.targetDays}-day target`;

            // ── Challenge link ──
            let challengeHtml = '';
            if (habit._project) {
                challengeHtml = `<div style="margin-bottom:12px;padding:8px 12px;background:#eef0ff;border:1px solid #c7d2fe;border-radius:6px;font-size:11px;color:#4338ca">⚔️ Linked to project: <strong>${habit._project.name}</strong></div>`;
            }

            panel.innerHTML = `
                <div class="detail-header">
                    <div class="detail-title">${habit.name}</div>
                    <div class="detail-subtitle">
                        <span>🔄 ${parseRepeatRule(habit.repeatRule)}</span>
                        ${goalInfo ? `<span>${goalInfo}</span>` : ''}
                        <span style="color:${status.color}">${status.text}</span>
                    </div>
                    <div class="detail-actions">
                        <button class="checkin-btn ${todayDone ? 'checked' : ''}" onclick="toggleCheckin('${habit.id}')" style="flex:1;font-size:14px;padding:12px 20px">
                            ${todayDone ? '✅ Done today' : '⬜ Check in today'}
                        </button>
                    </div>
                </div>

                <div class="nudge">${nudge}</div>

                ${challengeHtml}
                ${habit.encouragement ? `<div class="detail-encourage">"${habit.encouragement}"</div>` : ''}

                <div class="hero-cards">
                    <div class="hero-card">
                        <div class="hero-card-val" style="color:${streakColor}">🔥 ${streakInfo.count}</div>
                        <div class="hero-card-label">${streakInfo.unit} streak</div>
                        ${habit._streak > 0 && habit._streak >= bestStreak ? '<div class="hero-card-sub" style="color:#fcd34d">🏆 New record!</div>' : ''}
                    </div>
                    <div class="hero-card">
                        <div class="hero-card-val" style="color:#a78bfa">🏆 ${bestStreak}</div>
                        <div class="hero-card-label">best ever</div>
                        <div class="hero-card-sub" style="color:${streakGap > 0 ? '#888' : '#10b981'}">${streakGap > 0 ? streakGap + ' to beat' : "You're the best!"}</div>
                    </div>
                </div>

                <div class="progress-section">
                    <div style="font-size:11px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">📊 Progress</div>
                    ${progressHtml}
                </div>

                <div class="trend-line">
                    <span class="trend-arrow" style="color:${trendColor}">${trendIcon}</span>
                    <span style="color:${trendColor}">${trendText}</span>
                    ${milestone ? `<span style="margin-left:auto;font-size:11px">${milestone}</span>` : ''}
                </div>

                <div class="detail-section">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                        <div class="detail-section-title" style="margin-bottom:0">📅 Calendar</div>
                        <div class="view-tabs heatmap-tabs">
                            <button class="view-tab ${defaultView === 'day' ? 'active' : ''}" onclick="switchHeatmap('day')">Day</button>
                            <button class="view-tab ${defaultView === 'week' ? 'active' : ''}" onclick="switchHeatmap('week')">Week</button>
                            <button class="view-tab ${defaultView === 'month' ? 'active' : ''}" onclick="switchHeatmap('month')">Month</button>
                        </div>
                    </div>
                    <div>
                        <div id="heatmapDay" style="display:${defaultView === 'day' ? 'block' : 'none'}">${dayHeatmapHtml}</div>
                        <div id="heatmapWeek" style="display:${defaultView === 'week' ? 'block' : 'none'}">${weekViewHtml}</div>
                        <div id="heatmapMonth" style="display:${defaultView === 'month' ? 'block' : 'none'}">${monthViewHtml}</div>
                    </div>
                </div>

                <div class="detail-section">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                        <div class="detail-section-title" style="margin-bottom:0">📊 History</div>
                        <div class="view-tabs history-tabs">
                            <button class="view-tab ${defaultView === 'day' ? 'active' : ''}" onclick="switchHistory('day')">Day</button>
                            <button class="view-tab ${defaultView === 'week' ? 'active' : ''}" onclick="switchHistory('week')">Week</button>
                            <button class="view-tab ${defaultView === 'month' ? 'active' : ''}" onclick="switchHistory('month')">Month</button>
                        </div>
                    </div>
                    <div id="historyContainer">${historyHtml}</div>
                </div>

                <div class="coach-tip">💬 ${coachTip}</div>
            `;
        }

        // ============ ACTIONS ============

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            render();
        }

        async function toggleCheckin(habitId) {
            const stamp = todayStamp();
            const checkins = allCheckins[habitId] || [];
            const todayCheckin = checkins.find(c => c.checkinStamp === stamp && c.status === 2);

            try {
                if (todayCheckin) {
                    // Undo — set status to 0
                    await checkinHabit(habitId, stamp, 0);
                    // Remove from local
                    allCheckins[habitId] = checkins.filter(c => !(c.checkinStamp === stamp && c.status === 2));
                } else {
                    // Check in
                    const habit = allHabits.find(h => h.id === habitId);
                    const value = (habit && habit.type === 'Real') ? habit.goal : 1;
                    await checkinHabit(habitId, stamp, value);
                    // Add to local
                    if (!allCheckins[habitId]) allCheckins[habitId] = [];
                    allCheckins[habitId].push({ habitId, checkinStamp: stamp, status: 2, value, goal: habit?.goal || 1 });
                }
                render();
                renderDetail();
            } catch (e) {
                console.error('Checkin error:', e);
                alert('Failed to check in. Check console.');
            }
        }

        // ============ INIT ============

        async function refreshData() {
            const container = document.getElementById('habitContainer');
            container.innerHTML = '<div class="loading">Loading habits...</div>';

            try {
                const habits = await fetchHabits();

                // No data from proxy or cache — show paste UI
                if (!habits || habits.length === 0) {
                    showPasteUI();
                    return;
                }

                allHabits = habits;
                
                // Try to get projects (Open API works from file://)
                try { allProjects = await fetchProjects(); } catch { allProjects = []; }

                // Fetch checkins grouped by interval type (2 smart queries)
                try {
                    allCheckins = await fetchCheckinsGrouped(allHabits);
                    console.log(`[CHECKINS] Loaded for ${Object.keys(allCheckins).length} habits`);
                } catch (e) {
                    console.log('[CHECKINS] Failed:', e.message);
                    allCheckins = {};
                }

                // Fetch today's pomodoro/timer stats for timer-based habits
                try {
                    const today = new Date();
                    const todayStr = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(today.getDate()).padStart(2, '0')}`;
                    const pData = await fetchPomodoroStats(todayStr, todayStr);
                    pomodoroStats = pData?.taskDurations || {};
                    console.log(`[POMODORO] Timer stats:`, pomodoroStats);
                } catch (e) {
                    console.log('[POMODORO] Skip:', e.message);
                    pomodoroStats = {};
                }

                // Auto-complete timer habits if timer >= goal
                try { await triggerAutoComplete(); } catch (e) { console.log('[AUTO-COMPLETE] Skip:', e.message); }

                const cacheTime = getCacheTime();
                const fetchTime = window.__HABITS_FETCH_TIME__ || cacheTime;
                const src = fetchTime ? `Data from: ${new Date(fetchTime).toLocaleString()}` : `Updated: ${new Date().toLocaleTimeString()}`;
                document.getElementById('lastUpdated').textContent = src;
                render();
            } catch (e) {
                console.error('Load error:', e);
                showPasteUI();
            }
        }

        function clearCache() {
            localStorage.removeItem('habits_cache');
            localStorage.removeItem('habits_cache_time');
            localStorage.removeItem('checkins_cache');
            showPasteUI();
        }

        // Boot
        initMobileView();
        refreshData();
        
        // Handle resize (rotation, etc)
        window.addEventListener('resize', () => {
            const leftPanel = document.querySelector('.left-panel');
            const rightPanel = document.querySelector('.right-panel');
            
            if (window.innerWidth > 768) {
                // Desktop: show both panels
                leftPanel.classList.remove('hidden');
                rightPanel.classList.remove('hidden');
            } else {
                // Mobile: respect current toggle state
                if (mobileShowingDetail) {
                    leftPanel.classList.add('hidden');
                    rightPanel.classList.remove('hidden');
                } else {
                    leftPanel.classList.remove('hidden');
                    rightPanel.classList.add('hidden');
                }
            }
        });
    </script>
</body>
</html>
