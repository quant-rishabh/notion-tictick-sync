<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habits</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#333;font-size:12px;padding:40px 0 0;overflow:hidden;height:100vh}
        .nav{position:fixed;top:0;left:0;right:0;background:#fff;border-bottom:1px solid #e0e0e0;padding:8px 12px;z-index:100;display:flex;justify-content:space-between;align-items:center}
        .nav-title{font-size:13px;font-weight:600;color:#111}
        .nav-links{display:flex;gap:6px}
        .nav-link{padding:4px 10px;background:#f0f0f0;color:#666;border:1px solid #ddd;border-radius:4px;text-decoration:none;font-size:11px;cursor:pointer}
        .nav-link:hover{background:#e0e0e0;color:#111}
        .nav-link.active{background:#6366f1;color:#fff;border-color:#6366f1}
        .nav-brand{display:flex;align-items:center;gap:20px;min-width:0}
        .day-status{display:flex;align-items:center;gap:12px;white-space:nowrap}
        .day-date{color:#334155;font-size:12px;font-weight:700}
        .day-time{color:#334155;font-size:13px;font-weight:700}
        .day-meter{display:flex;align-items:center;gap:5px}
        .day-battery{position:relative;width:31px;height:15px;padding:2px;border:1.5px solid #94a3b8;border-radius:4px;box-sizing:border-box}
        .day-battery::after{position:absolute;top:4px;right:-4px;width:2px;height:5px;border-radius:0 2px 2px 0;background:#94a3b8;content:''}
        .day-battery-fill{display:block;width:40%;height:100%;border-radius:2px;background:#22c55e;transition:width .5s ease,background .5s ease;animation:dayBatteryPulse 3s ease-in-out infinite}
        .day-percent{min-width:43px;color:#475569;font-size:12px;font-weight:700}
        .habit-budget-strip{margin:0 16px 10px;padding:12px;background:linear-gradient(145deg,#102a43,#176b87);border:1px solid #1d5872;border-radius:14px;color:#fff;box-shadow:0 6px 16px rgba(16,42,67,.16)}
        .habit-budget-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
        .habit-budget-title{font-size:12px;font-weight:800;letter-spacing:.2px}
        .habit-budget-subtitle{color:#bfdbfe;font-size:9px}
        .habit-budget-rings{display:flex;align-items:center;gap:14px}
        .habit-ring-card{display:flex;align-items:center;gap:7px;min-width:0}
        .habit-ring{position:relative;width:58px;height:58px;flex:0 0 58px;border-radius:50%;background:conic-gradient(var(--ring-color) calc(var(--ring-progress) * 1%),rgba(255,255,255,.16) 0);animation:ringPulse 2.8s ease-in-out infinite}
        .habit-ring::before{position:absolute;inset:6px;border-radius:50%;background:#123652;content:''}
        .habit-ring-content{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:1}
        .habit-ring-content strong{color:#fff;font-size:13px;line-height:1}
        .habit-ring-content span{margin-top:2px;color:#bfdbfe;font-size:7px;text-transform:uppercase}
        .habit-ring-copy{display:flex;flex-direction:column;gap:2px}
        .habit-ring-label{color:#dbeafe;font-size:9px;font-weight:700}
        .habit-ring-value{color:#fff;font-size:10px;font-weight:600}
        .habit-budget-message{margin-left:auto;text-align:right}
        .habit-budget-message strong{display:block;color:#fde68a;font-size:12px}
        .habit-budget-message span{display:block;margin-top:2px;color:#bfdbfe;font-size:9px}
        .habit-budget-context{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.15);color:#dbeafe;font-size:9px}
        .habit-budget-context strong{display:block;color:#fff;font-size:11px}
        .habit-budget-compare{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.15)}
        .habit-budget-compare-head{display:flex;justify-content:space-between;align-items:baseline;color:#dbeafe;font-size:9px;margin-bottom:5px}
        .habit-budget-compare-head strong{color:#fff;font-size:10px;letter-spacing:.5px}
        .habit-budget-compare-head span{color:#bfdbfe}
        .habit-budget-day-track,.habit-budget-effort-track{position:relative;height:10px;background:rgba(255,255,255,.16);border-radius:999px;overflow:visible}
        .habit-budget-compare-time{height:100%;border-radius:999px;background:#60a5fa;transition:width .5s ease}
        .habit-budget-now-marker{position:absolute;top:-3px;width:2px;height:16px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px rgba(96,165,250,.35);transform:translateX(-1px);transition:left .5s ease}
        .habit-budget-now-marker:after{position:absolute;top:-13px;left:50%;color:#fff;font-size:8px;font-weight:800;content:'NOW';transform:translateX(-50%)}
        .habit-budget-effort-track{height:12px;background:rgba(255,255,255,.12)}
        .habit-budget-compare-effort{height:100%;border-radius:999px;background:linear-gradient(90deg,#fbbf24,#f59e0b);transition:width .5s ease}
        .habit-budget-timeline-labels{display:flex;justify-content:space-between;margin:5px 0 10px;color:#93c5fd;font-size:8px}
        .habit-budget-effort-caption{display:flex;justify-content:space-between;margin-top:5px;color:#bfdbfe;font-size:8px}
        @keyframes ringPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(52,211,153,0))}50%{filter:drop-shadow(0 0 7px rgba(52,211,153,.35))}}
        .habit-budget-strip.urgent{background:linear-gradient(145deg,#7f1d1d,#b45309);border-color:#dc2626}
        .habit-budget-strip.urgent .habit-budget-fill{background:#fca5a5}
        @keyframes habitBudgetPulse{0%,100%{opacity:.72}50%{opacity:1}}
        @media(max-width:760px){.habit-budget-strip{margin-left:10px;margin-right:10px}.habit-budget-rings{gap:8px}.habit-ring{width:50px;height:50px;flex-basis:50px}.habit-budget-message{display:none}}
        @keyframes dayBatteryPulse{0%,100%{opacity:.8}50%{opacity:1}}
        @media(max-width:760px){.day-status{display:none}}

        /* Master-detail layout */
        .container{display:grid;grid-template-columns:360px minmax(340px,38%) minmax(0,1fr);height:calc(100vh - 40px);max-width:100%;margin:0}
        .left-panel{display:contents}
        .filter-panel{min-width:0;border-right:1px solid #dbe5ef;overflow-y:auto;background:#f8fbff;padding:14px 12px}
        .filter-panel .habit-budget-strip{margin:0 0 16px}
        .filter-panel-title{color:#102a43;font-size:13px;font-weight:800;margin:2px 2px 14px}
        .habit-list-panel{min-width:340px;border-right:1px solid #dbe5ef;display:flex;flex-direction:column;overflow:hidden;background:#fafafa}
        .right-panel{flex:1;overflow-y:auto;padding:16px 20px;background:#fff}

        /* Left panel sections */
        .left-header{padding:10px 12px 0;flex-shrink:0}
        .stats{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
        .stat{flex:1;min-width:70px;background:#fff;border:1px solid #e0e0e0;border-radius:6px;padding:6px;text-align:center}
        .stat-val{font-size:16px;font-weight:700;color:#111}
        .stat-lbl{font-size:8px;color:#999;text-transform:uppercase;margin-top:1px}
        .filters{display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
        .filter-btn{padding:4px 10px;background:#f0f0f0;color:#666;border:1px solid #ddd;border-radius:4px;font-size:10px;cursor:pointer}
        .filter-btn:hover{background:#e0e0e0;color:#111}
        .filter-btn.active{background:#6366f1;color:#fff;border-color:#6366f1}

        /* Habit list */
        .habit-list{flex:1;overflow-y:auto;padding:0 12px 12px}
        .habit-week-header{display:grid;grid-template-columns:minmax(150px,1fr) repeat(7,34px);gap:4px;align-items:end;padding:8px 16px 5px;color:#94a3b8;font-size:9px;text-align:center;text-transform:uppercase}
        .habit-week-header-name{text-align:left}
        .habit-week-day{display:flex;flex-direction:column;gap:2px;line-height:1.1}
        .habit-week-day strong{color:#64748b;font-size:9px}
        .habit-week-day span{font-size:8px}
        .habit-week-day.today strong,.habit-week-day.today span{color:#2563eb}
        .habit-week-grid{display:grid;grid-template-columns:minmax(150px,1fr) repeat(7,34px);gap:4px;align-items:center;margin-top:8px}
        .habit-week-cell{display:flex;align-items:center;justify-content:center;height:25px;border-radius:5px;font-size:14px;font-weight:700}
        .habit-week-cell.done{color:#16803c;background:#ecfdf3}
        .habit-week-cell.partial{color:#b45309;background:#fef3c7;font-size:9px}
        .habit-week-cell.missed{color:#cbd5e1;background:#f8fafc}
        .habit-week-cell.today{outline:2px solid #bfdbfe;outline-offset:-1px}
        .habit-week-cell.today.done{box-shadow:0 0 0 2px #34d399,0 0 10px rgba(16,185,129,.35)}
        .habit-week-cell.future{color:#e2e8f0;background:#f8fafc}
        .habit-icon{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;margin-right:7px;border-radius:8px;background:#eef4ff;font-size:14px;vertical-align:middle}
        .habit-week-name-text{display:block;max-width:none;overflow-wrap:anywhere;line-height:1.25;white-space:normal}
        .habit-week-name{min-width:0;overflow:hidden;color:#172033;font-size:13px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
        .habit-week-name small{display:block;margin-top:2px;color:#64748b;font-size:9px;font-weight:500}
        .habit-item{background:#fff;border:1px solid #e0e0e0;border-radius:6px;padding:10px 12px;margin-bottom:6px;cursor:pointer;border-left:4px solid #ddd;transition:background 0.15s}
        .habit-item:hover{background:#f0f4ff}
        .habit-item.selected{background:#eef0ff;border-color:#6366f1}
        .habit-item.active{border-left-color:#10b981}
        .habit-item.slipping{border-left-color:#fbbf24}
        .habit-item.dying{border-left-color:#c4b5fd}
        .habit-item.archived{opacity:0.5;border-left-color:#bbb}
        .habit-item-header{display:flex;justify-content:space-between;align-items:center}
        .habit-item-name{font-size:12px;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
        .habit-item-right{display:flex;align-items:center;gap:8px}
        .habit-item-neglect{font-size:10px;font-weight:600}
        .habit-badge{font-size:8px;padding:2px 5px;border-radius:3px}
        .habit-badge.active{background:#d1fae5;color:#059669}
        .habit-badge.slipping{background:#fef3c7;color:#d97706}
        .habit-badge.dying{background:#fee2e2;color:#dc2626}
        .habit-badge.archived{background:#f0f0f0;color:#999}
        .habit-item-meta{display:flex;gap:10px;font-size:9px;color:#888;margin-top:4px}
        .habit-item-bar{margin-top:5px;height:3px;background:#e8e8e8;border-radius:2px;overflow:hidden}
        .habit-item-bar-fill{height:100%;border-radius:2px}
        .cycle-dots{display:flex;gap:3px;margin-top:6px;align-items:center}
        .cycle-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
        .cycle-dot.done{background:#10b981}
        .cycle-dot.missed{background:#fca5a5}
        .cycle-dot.future{background:#e8e8e8}

        /* Timer progress */
        .timer-progress{margin-top:6px}
        .timer-progress-header{display:flex;justify-content:space-between;font-size:10px;color:#555;margin-bottom:2px}
        .timer-progress-bar{height:5px;background:#e5e7eb;border-radius:3px;overflow:hidden}
        .timer-progress-fill{height:100%;border-radius:3px;transition:width 0.3s ease}
        .habit-progress-actions{display:flex;gap:4px;margin-top:6px}
        .habit-progress-actions button{padding:3px 7px;border:1px solid #bfdbfe;border-radius:6px;background:#eff6ff;color:#2563eb;font-size:9px;font-weight:700;cursor:pointer}
        .habit-progress-actions button:hover{background:#dbeafe}
        .habit-progress-actions button.complete{border-color:#86efac;background:#ecfdf5;color:#15803d}
        .habit-progress-input{width:42px;padding:3px 5px;border:1px solid #bfdbfe;border-radius:6px;font-size:9px;color:#1e3a8a}
        .habit-progress-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.28);z-index:300}
        .habit-progress-modal.open{display:flex}
        .habit-progress-dialog{width:min(310px,calc(100vw - 32px));padding:18px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 18px 45px rgba(15,23,42,.2)}
        .habit-progress-dialog h3{margin-bottom:14px;color:#1e293b;font-size:16px}
        .habit-progress-dialog label{display:flex;align-items:center;gap:8px;color:#475569;font-size:13px}
        .habit-progress-dialog input{width:145px;padding:9px 10px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px;outline:none}
        .habit-progress-dialog input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
        .habit-progress-dialog .modal-unit{font-size:13px;color:#475569}
        .habit-progress-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
        .habit-progress-dialog-actions button{min-width:94px;padding:8px 14px;border:1px solid #e2e8f0;border-radius:9px;background:#fff;color:#64748b;font-size:13px;cursor:pointer}
        .habit-progress-dialog-actions button.confirm{border-color:#5969a6;background:#5969a6;color:#fff}

        /* Habit type badges */
        .habit-type-badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;margin-right:4px}
        .habit-type-badge.timer{background:#dbeafe;color:#2563eb}
        .habit-type-badge.checkin{background:#d1fae5;color:#059669}

        /* Right panel detail */
        .detail-empty{display:flex;align-items:center;justify-content:center;height:100%;color:#aaa;font-size:14px;text-align:center}
        .detail-header{margin-bottom:16px}
        .detail-title{font-size:22px;font-weight:700;color:#111;margin-bottom:4px}
        .detail-subtitle{font-size:11px;color:#888;display:flex;gap:12px;flex-wrap:wrap}
        .detail-actions{margin-top:10px;display:flex;gap:8px;align-items:center}
        .checkin-btn{padding:6px 16px;background:#f0f0f0;color:#666;border:1px solid #ddd;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600}
        .checkin-btn:hover{background:#e0e0e0;color:#111}
        .checkin-btn.checked{background:#d1fae5;color:#059669;border-color:#10b981}

        /* Analysis cards */
        .analysis-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));gap:10px;margin-bottom:16px}
        .a-card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:14px;text-align:center}
        .a-card-val{font-size:24px;font-weight:700;margin-bottom:2px}
        .a-card-lbl{font-size:9px;color:#999;text-transform:uppercase}

        /* Checkin heatmap */
        .detail-section{margin-bottom:18px}
        .detail-section-title{font-size:12px;font-weight:600;color:#666;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
        .checkin-grid{display:flex;gap:3px;flex-wrap:wrap}
        .checkin-day{width:18px;height:18px;border-radius:3px;background:#e8e8e8;position:relative;cursor:default;font-size:7px;display:flex;align-items:center;justify-content:center;color:transparent}
        .checkin-day.done{background:#10b981}
        .checkin-day.partial{background:#f59e0b}
        .checkin-day.missed{background:#fee2e2}
        .checkin-day.future{background:#f5f5f5;border:1px solid #e0e0e0}
        .checkin-day.today{outline:2px solid #6366f1;outline-offset:1px}
        .checkin-day:hover{color:#333}
        .checkin-tooltip{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:3px 6px;border-radius:3px;font-size:9px;white-space:nowrap;display:none;z-index:10}
        .checkin-day:hover .checkin-tooltip{display:block}

        /* Weekly breakdown */
        .week-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px}
        .week-label{width:80px;color:#888;text-align:right}
        .week-bar{flex:1;height:8px;background:#e8e8e8;border-radius:4px;overflow:hidden}
        .week-bar-fill{height:100%;border-radius:4px}
        .week-val{width:40px;color:#666;font-size:10px}

        /* Encouragement */
        .detail-encourage{background:#f8f9ff;border:1px solid #e0e0e0;border-radius:8px;padding:14px;margin-bottom:16px;font-style:italic;color:#666;font-size:12px;border-left:3px solid #6366f1}

        /* Nudge banner */
        .nudge{background:linear-gradient(135deg,#eef0ff,#e8ebff);border:1px solid #c7d2fe;border-radius:8px;padding:14px 16px;margin-bottom:16px;font-size:13px;color:#4338ca;line-height:1.5}
        .nudge strong{color:#111}
        .coach-tip{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:14px 16px;margin-top:16px;font-size:12px;color:#92400e;line-height:1.5;border-left:3px solid #f59e0b}
        .coach-tip strong{color:#78350f}
        .grade-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;display:inline-block;min-width:18px;text-align:center}
        .grade-A{background:#d1fae5;color:#059669}
        .grade-B{background:#d1fae5;color:#059669}
        .grade-C{background:#fef3c7;color:#d97706}
        .grade-D{background:#fed7aa;color:#c2410c}
        .grade-F{background:#fee2e2;color:#dc2626}
        .urgency-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;min-width:28px;text-align:center;display:inline-block}
        .urgency-badge.low{background:#d1fae5;color:#059669}
        .urgency-badge.med{background:#fef3c7;color:#d97706}
        .urgency-badge.high{background:#fee2e2;color:#dc2626}

        .section-title{font-size:11px;font-weight:600;color:#111;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid #e0e0e0}
        .section-badge{font-size:9px;padding:2px 6px;border-radius:10px;background:#f0f0f0;color:#888}
        .loading{text-align:center;padding:40px;color:#999}
        .no-data{text-align:center;padding:40px;color:#aaa;font-size:13px}

        .progress-bar{flex:1;height:4px;background:#e8e8e8;border-radius:2px;overflow:hidden}
        .progress-fill{height:100%;border-radius:2px}

        /* ========== MOBILE RESPONSIVE ========== */
        @media (max-width: 768px) {
            body{padding:50px 0 0;overflow-y:auto;height:auto}
            
            .nav{padding:10px 12px;flex-wrap:wrap;gap:8px}
            .nav-title{font-size:14px}
            .nav-links{gap:4px;flex-wrap:wrap}
            .nav-link{padding:8px 12px;font-size:12px;min-height:36px}
            
            .container{display:flex;flex-direction:column;height:auto;min-height:calc(100vh - 50px)}
            .filter-panel{width:100%;border-right:none;border-bottom:1px solid #dbe5ef;padding:12px}
            .habit-list-panel{width:100%;min-width:100%;border-right:none;border-bottom:1px solid #e0e0e0;max-height:none}
            .right-panel{min-height:100vh;padding:16px 12px}
            
            .left-header{padding:12px}
            .stats{gap:8px}
            .stat{min-width:60px;padding:10px 6px}
            .stat-val{font-size:18px}
            .stat-lbl{font-size:9px}
            
            .filters{gap:8px;padding:0 4px}
            .filter-btn{padding:8px 14px;font-size:12px;min-height:36px}
            
            .habit-list{max-height:400px;padding:0 12px 12px}
            .habit-item{padding:14px;margin-bottom:8px}
            .habit-item-name{font-size:14px;max-width:55%}
            .habit-item-meta{font-size:11px;gap:12px;margin-top:6px;flex-wrap:wrap}
            .habit-item-bar{height:4px;margin-top:8px}
            .habit-badge{font-size:10px;padding:3px 8px}
            .grade-badge{font-size:11px;padding:4px 8px}
            .urgency-badge{font-size:10px;padding:4px 8px}
            
            .detail-empty{min-height:200px;font-size:16px}
            .detail-header{margin-bottom:20px}
            .detail-title{font-size:24px}
            .detail-subtitle{font-size:13px;gap:16px}
            .detail-actions{margin-top:14px;flex-wrap:wrap;gap:10px}
            .checkin-btn{padding:12px 20px;font-size:14px;min-height:44px;flex:1;text-align:center}
            
            .nudge{padding:16px;font-size:14px;line-height:1.6}
            .coach-tip{padding:16px;font-size:13px;line-height:1.6}
            .detail-encourage{padding:16px;font-size:13px}
            
            .analysis-grid{grid-template-columns:1fr 1fr;gap:12px}
            .a-card{padding:16px}
            .a-card-val{font-size:22px}
            .a-card-lbl{font-size:10px}
            
            .detail-section{margin-bottom:24px}
            .detail-section-title{font-size:13px;margin-bottom:12px}
            .checkin-grid{gap:4px}
            .checkin-day{width:22px;height:22px;border-radius:4px;font-size:8px}
            
            .week-row{margin-bottom:10px;font-size:13px}
            .week-label{width:90px}
            .week-bar{height:10px}
            .week-val{width:50px;font-size:12px}
            
            /* Touch-friendly inputs */

<body>

    <!-- Mobile Toggle Button -->

        <span id="toggleIcon">📊</span> <span id="toggleText">Details</span>

    <div class="habit-progress-modal" id="habitProgressModal" role="dialog" aria-modal="true" aria-labelledby="habitProgressModalTitle">

    <script>
        // State
        let allHabits = [];
        let allCheckins = {};
        let allHabitSections = [];
        let allProjects = [];
        let pomodoroStats = {}; // { habitName: minutes } from today's pomodoro/timer
        let progressModalHabitId = null;
        let currentFilter = 'today';
        let habitViewFilter = 'today';
        let habitDurationFilter = 'all';
        let habitSortFilter = 'urgent';
        let habitSearchFilter = '';
        let habitTypeFilter = 'all';
        let habitHoldTimer = null;
        let habitHoldTriggered = false;
        let selectedHabitId = null;
        let renderedHabits = []; // cached after render for detail lookup
        let budgetHabits = []; // today's budget remains independent of list filters
        let mobileShowingDetail = false; // for mobile panel toggle

        // ============ MOBILE PANEL TOGGLE ============
        function toggleMobilePanel() {
            const leftPanel = document.querySelector('.left-panel');
            const rightPanel = document.querySelector('.right-panel');
            const toggleIcon = document.getElementById('toggleIcon');
            const toggleText = document.getElementById('toggleText');
            
            mobileShowingDetail = !mobileShowingDetail;
            
            if (mobileShowingDetail) {
                leftPanel.classList.add('hidden');
                rightPanel.classList.remove('hidden');
                toggleIcon.textContent = '📋';
                toggleText.textContent = 'List';
            } else {
                leftPanel.classList.remove('hidden');
                rightPanel.classList.add('hidden');
                toggleIcon.textContent = '📊';
                toggleText.textContent = 'Details';
            }
        }

        // Auto-switch to detail view on mobile when selecting a habit
        function showDetailOnMobile() {
            if (window.innerWidth <= 768 && selectedHabitId) {
                const leftPanel = document.querySelector('.left-panel');
                const rightPanel = document.querySelector('.right-panel');
                const toggleIcon = document.getElementById('toggleIcon');
                const toggleText = document.getElementById('toggleText');
                
                mobileShowingDetail = true;
                leftPanel.classList.add('hidden');
                rightPanel.classList.remove('hidden');
                toggleIcon.textContent = '📋';
                toggleText.textContent = 'List';
            }
        }

        // Initialize mobile view (show list first, hide detail)
        function initMobileView() {
            if (window.innerWidth <= 768) {
                const rightPanel = document.querySelector('.right-panel');
                rightPanel.classList.add('hidden');
            }
        }

        // ============ DATA LOADING ============
        // TickTick requests go through the local server-side proxy.

        function getCachedHabits() {
            try { return JSON.parse(localStorage.getItem('habits_cache') || 'null'); } catch { return null; }
        }
        function setCachedHabits(data) {
            localStorage.setItem('habits_cache', JSON.stringify(data));
            localStorage.setItem('habits_cache_time', new Date().toISOString());
        }
        function getCacheTime() {
            return localStorage.getItem('habits_cache_time') || '';
        }

        function getCookieT() { return localStorage.getItem('ticktick_cookie_t') || ''; }
        function getCsrf() { return localStorage.getItem('ticktick_csrf') || ''; }
        function getToken() { return localStorage.getItem('ticktick_token') || ''; }

        async function fetchHabits() {
            const token = getToken();
            if (!token) {
                console.log('[HABITS] No TickTick bearer token in localStorage');
                return null;
            }
            
            try {
                const res = await fetch('/api/ticktick/habits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticktick_token: token })
                });
                if (res.ok) {
                    const data = await res.json();
                    console.log(`[HABITS] ✓ Got ${data.length} habits from TickTick`);
                    return data;
                }
            } catch (e) {
                console.log('[HABITS] API error:', e.message);
            }
            return null;
        }

        async function fetchHabitDetail(habitId) {
            const token = getToken();
            if (!token || !habitId) return null;
            try {
                const res = await fetch('/api/ticktick/habits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'get_habit_detail',
                        habitId,
                        ticktick_token: token
                    })
                });
                if (!res.ok) {
                    console.warn(`[HABITS] Detail request failed for ${habitId}: ${res.status}`);
                    return null;
                }
                const detail = await res.json();
                return detail && !Array.isArray(detail) ? detail : null;
            } catch (error) {
                console.warn(`[HABITS] Detail request failed for ${habitId}:`, error.message);
                return null;
            }
        }

        async function fetchHabitDetails(habits) {
            const details = await Promise.all(habits.map(habit => fetchHabitDetail(habit.id)));
            return habits.map((habit, index) => normalizeHabit({ ...habit, ...(details[index] || {}) }));
        }

        async function fetchHabitSections() {
            const token = getToken();
            if (!token) return [];
            try {
                const res = await fetch('/api/ticktick/habits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_habit_sections', ticktick_token: token })
                });
                if (!res.ok) {
                    console.warn(`[HABITS] Section request failed: ${res.status}`);
                    return [];
                }
                const sections = await res.json();
                return Array.isArray(sections) ? sections : [];
            } catch (error) {
                console.warn('[HABITS] Section request failed:', error.message);
                return [];
            }
        }

        function normalizeHabit(habit) {
            const rawType = String(habit.type || '').trim().toLowerCase();
            const rawGoal = Number(habit.goal);
            const type = rawType === 'real' || rawType === 'number' || rawType === 'decimal'
                ? 'Real'
                : rawGoal > 1
                    ? 'Count'
                    : 'Boolean';
            const goal = Number.isFinite(rawGoal) && rawGoal > 0 ? rawGoal : 1;
            const rawStep = Number(habit.step);
            const step = Number.isFinite(rawStep) && rawStep !== 0 ? Math.abs(rawStep) : 1;
            const unit = String(habit.unit || (type === 'Real' ? 'Count' : 'Count')).trim() || 'Count';
            const exDates = Array.isArray(habit.exDates)
                ? habit.exDates.map(value => Number(String(value).replace(/-/g, ''))).filter(Number.isFinite)
                : [];

            return {
                ...habit,
                type,
                goal,
                step,
                unit,
                exDates,
                _excludedStamps: new Set(exDates)
            };
        }

        function isHabitExcludedOnStamp(habit, stamp) {
            return Boolean(habit?._excludedStamps && habit._excludedStamps.has(Number(stamp)));
        }

        async function fetchCheckinsBatch(habitIds, lookbackDays) {
            try {
                const afterStamp = getStamp(daysAgo(lookbackDays));
                const res = await fetch('/api/ticktick/habits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'query_checkins',
                        habitIds,
                        afterStamp,
                        ticktick_cookie_t: getCookieT(),
                        ticktick_csrf: getCsrf()
                    })
                });
                if (res.ok) {
                    const normalized = normalizeCheckinsResponse(await res.json());
                    console.log(`[CHECKINS] Loaded ${Object.values(normalized).reduce((total, items) => total + items.length, 0)} records`);
                    return normalized;
                }
                console.warn(`[CHECKINS] TickTick returned ${res.status}`);
            } catch (e) { console.log('[CHECKINS] Failed:', e.message); }
            return {};
        }

        function normalizeCheckinsResponse(data) {
            if (Array.isArray(data)) {
                if (data.length > 0 && data[0].habitId && (data[0].checkinStamp || data[0].stamp)) {
                    return data.reduce((grouped, checkin) => {
                        const habitId = checkin.habitId;
                        if (!grouped[habitId]) grouped[habitId] = [];
                        grouped[habitId].push({
                            ...checkin,
                            checkinStamp: Number(checkin.checkinStamp || checkin.stamp),
                            status: checkin.status === undefined ? (Number(checkin.value) > 0 ? 2 : 0) : Number(checkin.status)
                        });
                        return grouped;
                    }, {});
                }
                return data.reduce((grouped, habitGroup) => {
                    if (!habitGroup || !habitGroup.habitId) return grouped;
                    grouped[habitGroup.habitId] = (habitGroup.checkins || []).map(checkin => ({
                        ...checkin,
                        checkinStamp: Number(checkin.checkinStamp || checkin.stamp),
                        status: checkin.status === undefined ? (Number(checkin.value) > 0 ? 2 : 0) : Number(checkin.status)
                    }));
                    return grouped;
                }, {});
            }

            if (data && data.checkins && !Array.isArray(data.checkins)) {
                return Object.fromEntries(Object.entries(data.checkins).map(([habitId, checkins]) => [
                    habitId,
                    (Array.isArray(checkins) ? checkins : []).map(checkin => ({
                        ...checkin,
                        checkinStamp: Number(checkin.checkinStamp || checkin.stamp),
                        status: checkin.status === undefined ? (Number(checkin.value) > 0 ? 2 : 0) : Number(checkin.status)
                    }))
                ]));
            }

            return {};
        }

        function normalizeCheckinsForHabits(grouped, habits) {
            const habitsById = new Map(habits.map(habit => [habit.id, habit]));
            return Object.fromEntries(Object.entries(grouped || {}).map(([habitId, checkins]) => {
                const habit = habitsById.get(habitId);
                const goal = habit?.goal || 1;
                return [habitId, (Array.isArray(checkins) ? checkins : []).map(checkin => {
                    const value = Number.isFinite(Number(checkin.value)) ? Number(checkin.value) : 0;
                    const completed = value >= goal || (habit?.type === 'Boolean' && Number(checkin.status) === 2);
                    return {
                        ...checkin,
                        value: completed && value === 0 ? goal : value,
                        goal,
                        status: completed ? 2 : 0
                    };
                })];
            }));
        }

        async function fetchCheckinsGrouped(habits) {
            const active = habits.filter(h => h.status !== 1);
            const shortIds = active.filter(h => getIntervalDays(h) <= 7).map(h => h.id);
            const longHabits = active.filter(h => getIntervalDays(h) > 7);
            const longIds = longHabits.map(h => h.id);

            const promises = [];
            if (shortIds.length > 0) {
                console.log(`[CHECKINS] Short batch: ${shortIds.length} habits, 365d lookback`);
                promises.push(fetchCheckinsBatch(shortIds, 365));
            }
            if (longIds.length > 0) {
                const maxLookback = 365;
                console.log(`[CHECKINS] Long batch: ${longIds.length} habits, ${maxLookback}d lookback`);
                promises.push(fetchCheckinsBatch(longIds, maxLookback));
            }

            const results = await Promise.all(promises);
            const merged = {};
            for (const result of results) {
                Object.assign(merged, result?.checkins || result || {});
            }
            return normalizeCheckinsForHabits(merged, habits);
        }

        async function checkinHabit(habitId, stamp, value) {
            const habit = allHabits.find(h => h.id === habitId);
            if (!habit) throw new Error('Habit not found');
            const res = await fetch(`https://api.ticktick.com/open/v1/habit/${encodeURIComponent(habitId)}/checkin`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + getToken(),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                    stamp,
                    value,
                    goal: habit.goal || 1,
                    status: value >= (habit.goal || 1) ? 2 : 0
                })
            });
            if (!res.ok) {
                const err = await res.text();
                console.error('[CHECKIN] Server response:', res.status, err);
                throw new Error(`Checkin failed: ${res.status}`);
            }
            const text = await res.text();
            return text ? JSON.parse(text) : {};
        }

        // ============ HELPERS ============

        function daysAgo(n) {
            const d = new Date();
            d.setDate(d.getDate() - n);
            return d;
        }

        function getStamp(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return parseInt(`${y}${m}${d}`);
        }

        function stampToDate(stamp) {
            const s = String(stamp);
            return new Date(parseInt(s.slice(0,4)), parseInt(s.slice(4,6)) - 1, parseInt(s.slice(6,8)));
        }

        function todayStamp() { return getStamp(new Date()); }

        function formatDate(date) {
            const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return `${days[date.getDay()]} ${date.getDate()} ${months[date.getMonth()]}`;
        }

        // Parse RRULE to human text
        function parseRepeatRule(rule) {
            if (!rule) return 'Daily';
            if (rule.includes('FREQ=DAILY') && rule.includes('INTERVAL=30')) return 'Monthly';
            if (rule.includes('FREQ=DAILY') && !rule.includes('INTERVAL=')) return 'Daily';
            if (rule.includes('FREQ=DAILY;INTERVAL=1')) return 'Daily';
            if (rule.includes('FREQ=DAILY;INTERVAL=')) {
                const m = rule.match(/INTERVAL=(\d+)/);
                return m ? `Every ${m[1]} days` : 'Daily';
            }
            if (rule.includes('FREQ=WEEKLY')) {
                const timesMatch = rule.match(/TT_TIMES=(\d+)/);
                if (timesMatch) return `${timesMatch[1]}x per week`;
                const dayMatch = rule.match(/BYDAY=([A-Z,]+)/);
                if (dayMatch) {
                    const days = dayMatch[1].split(',');
                    if (days.length === 7) return 'Daily';
                    const shortDays = days.map(d => d.slice(0,2)).join(',');
                    return `${shortDays}`;
                }
                return 'Weekly';
            }
            if (rule.includes('FREQ=MONTHLY')) return 'Monthly';
            return rule;
        }

        // Get cycle length in days from repeatRule
        function getIntervalDays(habit) {
            const rule = habit.repeatRule || '';
            if (rule.includes('FREQ=DAILY;INTERVAL=1')) return 1;
            if (rule.includes('FREQ=DAILY') && !rule.includes('INTERVAL=')) return 1;
            if (rule.includes('FREQ=DAILY;INTERVAL=')) {
                const m = rule.match(/INTERVAL=(\d+)/);
                return m ? parseInt(m[1]) : 1;
            }
            if (rule.includes('FREQ=WEEKLY')) {
                const timesMatch = rule.match(/TT_TIMES=(\d+)/);
                if (timesMatch) return 7 / parseInt(timesMatch[1]);
                const dayMatch = rule.match(/BYDAY=([A-Z,]+)/);
                if (dayMatch) return 7 / dayMatch[1].split(',').length;
                return 7;
            }
            if (rule.includes('FREQ=MONTHLY')) return 30;
            return 1;
        }

        // Get how many times per week this habit expects
        function getExpectedWeeklyFreq(habit) {
            const rule = habit.repeatRule || '';
            if (rule.includes('FREQ=DAILY') && !rule.includes('INTERVAL=')) return 7;
            if (rule.includes('FREQ=DAILY;INTERVAL=1')) return 7;
            if (rule.includes('FREQ=DAILY;INTERVAL=')) {
                const m = rule.match(/INTERVAL=(\d+)/);
                return m ? Math.floor(7 / parseInt(m[1])) : 7;
            }
            if (rule.includes('FREQ=WEEKLY')) {
                const timesMatch = rule.match(/TT_TIMES=(\d+)/);
                if (timesMatch) return parseInt(timesMatch[1]);
                const dayMatch = rule.match(/BYDAY=([A-Z,]+)/);
                if (dayMatch) return dayMatch[1].split(',').length;
                return 1;
            }
            if (rule.includes('FREQ=MONTHLY')) return 0.25; // ~once a month
            return 7; // default daily
        }

        function isHabitDueToday(habit) {
            if (isHabitExcludedOnStamp(habit, todayStamp())) return false;
            const scheduledDays = getByDaySchedule(habit);
            if (scheduledDays) return scheduledDays.includes(new Date().getDay());

            const rule = habit.repeatRule || '';
            if (rule.includes('FREQ=DAILY')) return true;

            const today = todayStamp();
            const completedToday = (allCheckins[habit.id] || []).some(checkin =>
                checkin.checkinStamp === today && checkin.status === 2
            );
            const interval = habit._intervalDays || getIntervalDays(habit);
            return completedToday || (habit._daysSinceLast || 0) >= Math.max(1, interval * 0.8);
        }

        function formatHabitMinutes(minutes) {
            if (minutes < 60) return `${minutes}m`;
            const hours = Math.floor(minutes / 60);
            const remaining = minutes % 60;
            return `${hours}h${remaining ? ` ${remaining}m` : ''}`;
        }

        function getHabitDurationMinutes(habit) {
            const structuredGoal = Number(habit.goal);
            if (isTimerUnit(habit.unit) && structuredGoal > 0) {
                return isHourUnit(habit.unit) ? structuredGoal * 60 : structuredGoal;
            }

            const title = String(habit.name || '');
            const match = title.match(/\b(\d+(?:\.\d+)?)\s*(?:-|–|—)?\s*(minutes?|mins?|hours?|hrs?)\b/i);
            if (!match) return 0;
            const value = Number(match[1]);
            return /hour|hr/i.test(match[2]) ? Math.round(value * 60) : Math.round(value);
        }

        function updateHabitTimeBudget(habitList) {
            const budget = document.getElementById('habitTimeBudget');
            if (!budget) return;

            let totalMinutes = 0;
            let completedMinutes = 0;
            const plannedHabits = habitList.filter(habit => habit._status !== 'archived' && isHabitDueToday(habit))
                .filter(habit => getHabitDurationMinutes(habit) > 0)
            plannedHabits.forEach(habit => {
                    const goalMinutes = getHabitDurationMinutes(habit);
                    const todayCheckin = (allCheckins[habit.id] || []).find(checkin => checkin.checkinStamp === todayStamp());
                    const todayDone = todayCheckin && todayCheckin.status === 2;
                    const timerMinutes = Number(pomodoroStats[habit.name]) || 0;
                    const measuredMinutes = Number(todayCheckin && todayCheckin.value) || 0;
                    const completed = Math.min(goalMinutes, Math.max(timerMinutes, measuredMinutes, todayDone ? goalMinutes : 0));
                    totalMinutes += goalMinutes;
                    completedMinutes += completed;
                });

            const remainingMinutes = Math.max(0, totalMinutes - completedMinutes);
            const now = new Date();
            const endOfDay = new Date(now);
            endOfDay.setHours(24, 0, 0, 0);
            const dayMinutesLeft = Math.ceil((endOfDay - now) / 60000);
            const dayElapsedPct = Math.min(100, Math.max(0, Math.round(((1440 - dayMinutesLeft) / 1440) * 100)));
            const weekday = now.toLocaleDateString('en-US', { weekday: 'long' });
            const dateLabel = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const timeLabel = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            const completedHabitCount = plannedHabits.filter(habit =>
                (allCheckins[habit.id] || []).some(checkin => checkin.checkinStamp === todayStamp() && checkin.status === 2)
            ).length;
            const completionPct = totalMinutes > 0
                ? Math.min(100, Math.round((completedMinutes / totalMinutes) * 100))
                : 100;
            const isUrgent = remainingMinutes > dayMinutesLeft;
            const dayCapacityPct = dayMinutesLeft > 0
                ? Math.min(100, Math.round((remainingMinutes / dayMinutesLeft) * 100))
                : 100;
            budget.classList.toggle('urgent', isUrgent);
            budget.innerHTML =
                `<div class="habit-budget-context"><span><strong>${weekday}</strong>${dateLabel}</span><span><strong>${timeLabel}</strong>current time</span><span><strong>${plannedHabits.length} planned</strong>${completedHabitCount} completed</span></div>` +
                `<div class="habit-budget-rings">` +
                    `<div class="habit-ring-card">` +
                        `<div class="habit-ring" style="--ring-color:#34d399;--ring-progress:${completionPct}">` +
                            `<div class="habit-ring-content"><strong>${completionPct}%</strong><span>done</span></div>` +
                        `</div>` +
                        `<div class="habit-ring-copy"><span class="habit-ring-label">Done</span><span class="habit-ring-value">${formatHabitMinutes(completedMinutes)} / ${formatHabitMinutes(totalMinutes)}</span></div>` +
                    `</div>` +
                    `<div class="habit-ring-card">` +
                        `<div class="habit-ring" style="--ring-color:${isUrgent ? '#fb7185' : '#fbbf24'};--ring-progress:${dayCapacityPct}">` +
                            `<div class="habit-ring-content"><strong>${dayCapacityPct}%</strong><span>of day</span></div>` +
                        `</div>` +
                        `<div class="habit-ring-copy"><span class="habit-ring-label">Needed</span><span class="habit-ring-value">${formatHabitMinutes(remainingMinutes)} / ${formatHabitMinutes(dayMinutesLeft)}</span></div>` +
                    `</div>` +
                `</div>` +
                `<div class="habit-budget-compare">` +
                    `<div class="habit-budget-compare-head"><strong>DAY SO FAR</strong><span>${dayElapsedPct}% elapsed · ${formatHabitMinutes(dayMinutesLeft)} left</span></div>` +
                    `<div class="habit-budget-day-track"><div class="habit-budget-compare-time" style="width:${dayElapsedPct}%"></div><div class="habit-budget-now-marker" style="left:${dayElapsedPct}%"></div></div>` +
                    `<div class="habit-budget-timeline-labels"><span>START</span><span>NOW</span><span>MIDNIGHT</span></div>` +
                    `<div class="habit-budget-compare-head"><strong>HABIT LOAD</strong><span>${formatHabitMinutes(remainingMinutes)} still to fit</span></div>` +
                    `<div class="habit-budget-effort-track"><div class="habit-budget-compare-effort" style="width:${dayCapacityPct}%"></div></div>` +
                    `<div class="habit-budget-effort-caption"><span>Available time</span><span>${dayCapacityPct}% of remaining day</span></div>` +
                `</div>`;
        }

        // Day abbreviation → JS getDay() index
        const BYDAY_MAP = { SU: 0, MO: 1, TU: 2, WE: 3, TH: 4, FR: 5, SA: 6 };

        // For FREQ=WEEKLY;BYDAY=xx,yy (NOT TT_TIMES), returns array of day-of-week numbers, else null
        function getByDaySchedule(habit) {
            const rule = habit.repeatRule || '';
            if (!rule.includes('FREQ=WEEKLY')) return null;
            if (rule.includes('TT_TIMES=')) return null; // "3x per week" — no specific days known
            const m = rule.match(/BYDAY=([A-Z,]+)/);
            if (!m) return null;
            return m[1].split(',').map(d => BYDAY_MAP[d]).filter(d => d !== undefined);
        }

        // Returns stamps of scheduled slots in the past windowDays (today included if scheduled), newest first
        function getByDaySlots(scheduledDays, windowDays) {
            const slots = [];
            const now = new Date();
            for (let i = 0; i < windowDays; i++) {
                const d = new Date(now); d.setDate(d.getDate() - i);
                if (scheduledDays.includes(d.getDay())) slots.push(getStamp(d));
            }
            return slots;
        }

        // Calculate streak for a habit
        function calcStreak(habitId) {
            const checkins = allCheckins[habitId] || [];
            const habit = allHabits.find(item => item.id === habitId);
            if (checkins.length === 0) return 0;

            // Sort by stamp descending
            const stamps = checkins
                .filter(c => c.status === 2)
                .filter(c => !isHabitExcludedOnStamp(habit, c.checkinStamp))
                .map(c => c.checkinStamp)
                .sort((a, b) => b - a);

            if (stamps.length === 0) return 0;

            // Count consecutive days from today backwards
            let streak = 0;
            let checkDate = new Date();
            
            for (let i = 0; i < 90; i++) {
                const stamp = getStamp(checkDate);
                if (isHabitExcludedOnStamp(habit, stamp)) {
                    checkDate.setDate(checkDate.getDate() - 1);
                    continue;
                }
                if (stamps.includes(stamp)) {
                    streak++;
                } else if (i > 0) {
                    // Allow today to be unchecked (day not over yet)
                    break;
                }
                checkDate.setDate(checkDate.getDate() - 1);
            }
            return streak;
        }

        // Get habit age in days (capped, min 1)
        function getHabitAge(habit) {
            const created = new Date(habit.createdTime);
            const now = new Date();
            return Math.max(1, Math.floor((now - created) / 86400000));
        }

        // Determine habit health status (age-aware)
        function getHabitStatus(habit) {
            if (habit.status === 1) return 'archived';
            
            const checkins = allCheckins[habit.id] || [];
            // Done today → always active, regardless of window math
            if (checkins.some(c => c.status === 2 && c.checkinStamp === getStamp(new Date()) && !isHabitExcludedOnStamp(habit, c.checkinStamp))) return 'active';
            const now = new Date();
            const ageDays = getHabitAge(habit);
            const windowDays = Math.min(ageDays, 7);
            const stamps = [];
            for (let i = 0; i < windowDays; i++) {
                const d = new Date(now);
                d.setDate(d.getDate() - i);
                const stamp = getStamp(d);
                if (!isHabitExcludedOnStamp(habit, stamp)) stamps.push(stamp);
            }

            const weeklyExpected = getExpectedWeeklyFreq(habit);
            const expected = weeklyExpected * stamps.length / 7;
            const done = checkins.filter(c => c.status === 2 && stamps.includes(c.checkinStamp)).length;
            const ratio = expected > 0 ? done / expected : 0;

            if (ratio >= 0.6) return 'active';
            if (ratio >= 0.3) return 'slipping';
            return 'dying';
        }

        // Get letter grade from percentage
        function getGrade(pct) {
            if (pct >= 80) return 'A';
            if (pct >= 60) return 'B';
            if (pct >= 40) return 'C';
            if (pct >= 20) return 'D';
            return 'F';
        }

        // Calculate best streak for a habit
        function calcBestStreak(habitId) {
            const checkins = allCheckins[habitId] || [];
            const stamps = checkins.filter(c => c.status === 2).map(c => c.checkinStamp).sort();
            let best = 0, curr = 0;
            for (let i = 0; i < stamps.length; i++) {
                if (i === 0) { curr = 1; }
                else {
                    const prev = stampToDate(stamps[i-1]);
                    const now = stampToDate(stamps[i]);
                    curr = Math.round((now - prev) / 86400000) === 1 ? curr + 1 : 1;
                }
                if (curr > best) best = curr;
            }
            return best;
        }

        // Check if habit matches a project (for challenge linking)
        // Only match if the project name IS the habit name (or very close), not substring
        function findMatchingProject(habit) {
            const habitName = habit.name.toLowerCase().replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();
            return allProjects.find(p => {
                const projName = p.name.toLowerCase().replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();
                // Exact match or one is a very close prefix (within 5 chars difference)
                return projName === habitName 
                    || (habitName.startsWith(projName) && habitName.length - projName.length < 5)
                    || (projName.startsWith(habitName) && projName.length - habitName.length < 5);
            });
        }

        // Calculate urgency score (higher = more neglected)
        // urgency = (1 - done/7) + daysSinceLast/interval
        // All habits measured over last 7 cycles for fair comparison
        function calcUrgency(habit) {
            if (habit.status === 1) return 0;
            const checkins = allCheckins[habit.id] || [];
            const now = new Date();
            const ageDays = getHabitAge(habit);
            const intervalDays = getIntervalDays(habit);

            // Last 7 cycles window (capped to habit age)
            const numCycles = 7;
            const windowDays = Math.min(Math.round(intervalDays * numCycles), ageDays);

            // Count done in window
            const windowStamps = [];
            for (let i = 0; i < windowDays; i++) {
                const d = new Date(now); d.setDate(d.getDate() - i);
                const stamp = getStamp(d);
                if (!isHabitExcludedOnStamp(habit, stamp)) windowStamps.push(stamp);
            }
            const expected = Math.min(numCycles, Math.floor(windowStamps.length / intervalDays));
            const done = checkins.filter(c => c.status === 2 && windowStamps.includes(c.checkinStamp)).length;
            const doneStamps = checkins
                .filter(c => c.status === 2 && !isHabitExcludedOnStamp(habit, c.checkinStamp))
                .map(c => c.checkinStamp)
                .sort((a, b) => b - a);

            // consistency: 1 - done/expected (0=perfect, 1=completely missing)
            const consistency = expected > 0 ? Math.max(0, 1 - done / expected) : 0;

            // BYDAY habits (exact scheduled days, not "Nx per week"): use slot-based counting
            const scheduledDays = getByDaySchedule(habit);
            if (scheduledDays) {
                const slots = getByDaySlots(scheduledDays, windowDays)
                    .filter(stamp => !isHabitExcludedOnStamp(habit, stamp));
                const slotsExpected = slots.length;
                const slotsDone = checkins.filter(c => c.status === 2 && slots.includes(c.checkinStamp)).length;
                const byConsistency = Math.max(0, 1 - slotsDone / slotsExpected);
                const slotsSinceLast = doneStamps.length > 0
                    ? slots.filter(s => s > doneStamps[0]).length
                    : slotsExpected;
                const byUrgency = byConsistency + slotsSinceLast;
                const bar = '█'.repeat(Math.min(20, Math.round(byUrgency))) + '░'.repeat(Math.max(0, 20 - Math.round(byUrgency)));
                const tag = byUrgency >= 10 ? '🔴' : byUrgency >= 3 ? '🟡' : '🟢';
                console.log(
                    `${tag} %-40s  urgency=%s  |${bar}|\n` +
                    `   age=${ageDays}d  [BYDAY] slots=${slotsDone}/${slotsExpected}  slotsMissed=${slotsSinceLast}` +
                    `  consistency=${byConsistency.toFixed(2)}`,
                    habit.name.slice(0, 40), byUrgency.toFixed(2)
                );
                return byUrgency;
            }

            // starvation: how many full cycles since you last did it (unbounded)
            let daysSinceLast;
            if (doneStamps.length > 0) {
                const lastDate = stampToDate(doneStamps[0]);
                daysSinceLast = Math.max(0, Math.floor((now - lastDate) / 86400000));
            } else {
                daysSinceLast = ageDays; // no stamps → assume never done in known history
            }
            daysSinceLast = Math.min(daysSinceLast, ageDays);
            const starvation = daysSinceLast / intervalDays;

            const urgency = consistency + starvation;
            const bar = '█'.repeat(Math.min(20, Math.round(urgency))) + '░'.repeat(Math.max(0, 20 - Math.round(urgency)));
            const tag = urgency >= 10 ? '🔴' : urgency >= 3 ? '🟡' : '🟢';
            console.log(
                `${tag} %-40s  urgency=%s  |${bar}|\n` +
                `   age=${ageDays}d  cycle=${intervalDays.toFixed(1)}d  7cycles=${windowDays}d  done=${done}/${expected}` +
                `  last=${daysSinceLast === 0 ? 'today' : daysSinceLast + 'd ago'}` +
                `  consistency=${consistency.toFixed(2)}  starvation=${starvation.toFixed(2)}`,
                habit.name.slice(0, 40), urgency.toFixed(2)
            );

            return urgency;
        }

        // Get age-aware monthly score
        function getMonthlyScore(habit) {
            const checkins = allCheckins[habit.id] || [];
            const ageDays = getHabitAge(habit);
            const windowDays = Math.min(ageDays, 30);
            const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - windowDays);
            let effectiveWindowDays = 0;
            for (let offset = 0; offset < windowDays; offset++) {
                const date = new Date();
                date.setDate(date.getDate() - offset);
                if (!isHabitExcludedOnStamp(habit, getStamp(date))) effectiveWindowDays++;
            }
            const done = checkins.filter(c => {
                const d = stampToDate(c.checkinStamp);
                return c.status === 2 && d >= cutoff && !isHabitExcludedOnStamp(habit, c.checkinStamp);
            }).length;
            const expected = Math.max(1, Math.round(getExpectedWeeklyFreq(habit) * effectiveWindowDays / 7));
            const pct = Math.min(100, Math.round((done / expected) * 100));
            return { done, expected, pct, windowDays };
        }

        // ============ STATUS & DISPLAY HELPERS ============

        // Human-readable status tag for a habit
        function getStatusTag(habit) {
            const checkins = allCheckins[habit.id] || [];
            const today = todayStamp();
            if (isHabitExcludedOnStamp(habit, today)) return { text: 'Excluded today', cls: 'on-track', color: '#64748b' };
            const todayDone = checkins.some(c => c.checkinStamp === today && c.status === 2);
            if (todayDone) return { text: 'Done ✅', cls: 'done', color: '#10b981' };
            if (habit._status === 'archived') return { text: 'Archived', cls: 'on-track', color: '#666' };

            const intervalDays = habit._intervalDays || getIntervalDays(habit);
            const daysSince = habit._daysSinceLast || 0;
            const streak = habit._streak || 0;

            if (daysSince > intervalDays * 1.5) {
                const overdueDays = Math.round(daysSince - intervalDays);
                return { text: `${overdueDays}d overdue`, cls: 'overdue', color: '#ef4444' };
            }
            if (streak >= 3 && daysSince >= intervalDays * 0.8) {
                return { text: 'Streak at risk!', cls: 'streak-risk', color: '#f59e0b' };
            }
            if (daysSince > intervalDays) {
                return { text: 'Falling behind', cls: 'overdue', color: '#f59e0b' };
            }
            if (daysSince >= intervalDays * 0.8) {
                return { text: 'Due today', cls: 'due', color: '#fcd34d' };
            }
            if (intervalDays > 7 && daysSince < intervalDays * 0.5) {
                const daysLeft = Math.round(intervalDays - daysSince);
                return { text: `Due in ${daysLeft}d`, cls: 'on-track', color: '#10b981' };
            }
            return { text: 'On track', cls: 'on-track', color: '#10b981' };
        }

        // Get streak with frequency-appropriate unit
        function getStreakWithUnit(habit) {
            const streak = habit._streak || 0;
            const interval = habit._intervalDays || getIntervalDays(habit);
            if (interval <= 1.5) return { count: streak, unit: streak === 1 ? 'day' : 'days' };
            if (interval <= 10) return { count: streak, unit: streak === 1 ? 'day' : 'days' };
            if (interval <= 45) {
                const months = Math.floor(streak / 30);
                if (months > 0) return { count: months, unit: months === 1 ? 'month' : 'months' };
                return { count: streak, unit: streak === 1 ? 'day' : 'days' };
            }
            return { count: streak, unit: streak === 1 ? 'day' : 'days' };
        }

        // Get progress for N cycles back
        function getCycleProgress(habit, numCycles) {
            const checkins = allCheckins[habit.id] || [];
            const interval = habit._intervalDays || getIntervalDays(habit);
            const windowDays = Math.round(interval * numCycles);
            const now = new Date();
            const stamps = [];
            for (let i = 0; i < windowDays; i++) {
                const d = new Date(now); d.setDate(d.getDate() - i);
                const stamp = getStamp(d);
                if (!isHabitExcludedOnStamp(habit, stamp)) stamps.push(stamp);
            }
            const done = checkins.filter(c => c.status === 2 && stamps.includes(c.checkinStamp) && !isHabitExcludedOnStamp(habit, c.checkinStamp)).length;
            const expected = Math.min(numCycles, Math.floor(stamps.length / interval));
            const pct = expected > 0 ? Math.min(100, Math.round((done / expected) * 100)) : 0;
            return { done, expected, pct, windowDays: stamps.length };
        }

        // Get adaptive progress windows based on frequency
        function getAdaptiveWindows(habit) {
            const interval = habit._intervalDays || getIntervalDays(habit);
            const ageDays = getHabitAge(habit);
            const fetchedLookback = interval > 7 ? Math.min(Math.round(interval * 3), 365) : 30;
            const maxCycles = Math.floor(Math.min(ageDays, fetchedLookback) / interval);

            if (interval <= 1.5) {
                return [
                    { label: 'Today', cycles: 1 },
                    { label: 'Last 7 days', cycles: Math.min(7, maxCycles) },
                    { label: 'Last 30 days', cycles: Math.min(30, maxCycles) },
                ].filter(w => w.cycles >= 1);
            }
            if (interval <= 5) {
                return [
                    { label: 'This week', cycles: Math.min(Math.round(7 / interval), maxCycles) },
                    { label: 'Last 4 weeks', cycles: Math.min(Math.round(28 / interval), maxCycles) },
                    { label: 'Last 7 weeks', cycles: Math.min(Math.round(49 / interval), maxCycles) },
                ].filter(w => w.cycles >= 1);
            }
            if (interval <= 10) {
                return [
                    { label: 'This week', cycles: 1 },
                    { label: 'Last 7 weeks', cycles: Math.min(7, maxCycles) },
                    { label: 'Last 12 weeks', cycles: Math.min(12, maxCycles) },
                ].filter(w => w.cycles >= 1);
            }
            if (interval <= 45) {
                return [
                    { label: 'This month', cycles: 1 },
                    { label: 'Last 3 months', cycles: Math.min(3, maxCycles) },
                    { label: 'Last 7 months', cycles: Math.min(7, maxCycles) },
                ].filter(w => w.cycles >= 1);
            }
            return [
                { label: 'This cycle', cycles: 1 },
                { label: 'Last 4 cycles', cycles: Math.min(4, maxCycles) },
                { label: 'Last 7 cycles', cycles: Math.min(7, maxCycles) },
            ].filter(w => w.cycles >= 1);
        }

        // Build GitHub-style day heatmap
        function buildDayHeatmap(habit, numWeeks) {
            const checkins = allCheckins[habit.id] || [];
            const doneStamps = new Set(checkins.filter(c => c.status === 2).map(c => c.checkinStamp));
            const today = new Date();
            const todayS = todayStamp();
            const totalDays = numWeeks * 7;

            let html = '<div class="gh-heatmap">';
            for (let i = totalDays - 1; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(today.getDate() - i);
                const stamp = getStamp(d);
                const isToday = stamp === todayS;
                const isBeforeCreation = d < new Date(habit.createdTime);

                if (isBeforeCreation) {
                    html += '<div class="gh-cell empty"></div>';
                } else if (isHabitExcludedOnStamp(habit, stamp)) {
                    html += `<div class="gh-cell empty"><div class="gh-tip">${formatDate(d)} · Excluded</div></div>`;
                } else {
                    const done = doneStamps.has(stamp);
                    html += `<div class="gh-cell ${done ? 'done' : 'missed'}${isToday ? ' today' : ''}"><div class="gh-tip">${formatDate(d)}${done ? ' ✅' : ''}</div></div>`;
                }
            }
            html += '</div>';
            return html;
        }

        // Build cycle-based view (week or month rows)
        function buildCycleView(habit, mode, count) {
            const checkins = allCheckins[habit.id] || [];
            const doneStamps = checkins.filter(c => c.status === 2).map(c => c.checkinStamp);
            const now = new Date();
            let html = '';

            if (mode === 'week') {
                const weekExpected = Math.max(1, Math.ceil(getExpectedWeeklyFreq(habit)));
                for (let w = 0; w < count; w++) {
                    const stamps = [];
                    for (let d = 0; d < 7; d++) {
                        const dt = new Date(now); dt.setDate(dt.getDate() - (w * 7 + d));
                        stamps.push(getStamp(dt));
                    }
                    const done = doneStamps.filter(s => stamps.includes(s) && !isHabitExcludedOnStamp(habit, s)).length;
                    const pct = Math.min(100, Math.round((done / weekExpected) * 100));
                    const color = pct >= 100 ? '#10b981' : pct >= 50 ? '#f59e0b' : (done === 0 ? '#e0e0e0' : '#ef4444');
                    const label = w === 0 ? 'This week' : w === 1 ? 'Last week' : `${w}w ago`;
                    html += `<div class="cycle-row">
                        <div class="cycle-label">${label}</div>
                        <div class="cycle-bar"><div class="cycle-bar-fill" style="width:${pct}%;background:${color}"></div></div>
                        <div class="cycle-val">${done}/${weekExpected}</div>
                        <div class="cycle-check">${pct >= 100 ? '✅' : ''}</div>
                    </div>`;
                }
            } else if (mode === 'month') {
                for (let m = 0; m < count; m++) {
                    const monthDate = new Date(now.getFullYear(), now.getMonth() - m, 1);
                    const monthEnd = new Date(now.getFullYear(), now.getMonth() - m + 1, 0);
                    const monthStamps = [];
                    for (let d = 1; d <= monthEnd.getDate(); d++) {
                        const dt = new Date(monthDate.getFullYear(), monthDate.getMonth(), d);
                        const stamp = getStamp(dt);
                        if (dt <= now && !isHabitExcludedOnStamp(habit, stamp)) monthStamps.push(stamp);
                    }
                    const done = doneStamps.filter(s => monthStamps.includes(s)).length;
                    const monthExpected = Math.max(1, Math.round(getExpectedWeeklyFreq(habit) * monthStamps.length / 7));
                    const pct = Math.min(100, Math.round((done / monthExpected) * 100));
                    const color = pct >= 80 ? '#10b981' : pct >= 50 ? '#f59e0b' : (done === 0 ? '#e0e0e0' : '#ef4444');
                    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                    const label = m === 0 ? 'This month' : `${months[monthDate.getMonth()]} '${String(monthDate.getFullYear()).slice(2)}`;
                    html += `<div class="cycle-row">
                        <div class="cycle-label">${label}</div>
                        <div class="cycle-bar"><div class="cycle-bar-fill" style="width:${pct}%;background:${color}"></div></div>
                        <div class="cycle-val">${done}/${monthExpected}</div>
                        <div class="cycle-check">${pct >= 80 ? '✅' : ''}</div>
                    </div>`;
                }
            }
            return html;
        }

        // Build history bar chart
        function buildHistoryChart(habit, mode) {
            const checkins = allCheckins[habit.id] || [];
            const activityCheckins = checkins.filter(c =>
                (c.status === 2 || Number(c.value) > 0) &&
                !isHabitExcludedOnStamp(habit, c.checkinStamp)
            );
            const isMeasuredHabit = habit.type === 'Real' && Number(habit.goal) > 0;
            const habitGoal = isMeasuredHabit ? Number(habit.goal) : 1;
            const now = new Date();
            const bars = [];

            const ageDays = getHabitAge(habit);

            if (mode === 'day') {
                const dayCount = Math.min(ageDays, 365);
                for (let i = dayCount - 1; i >= 0; i--) {
                    const d = new Date(now); d.setDate(d.getDate() - i);
                    const stamp = getStamp(d);
                    const dayCheckins = activityCheckins.filter(c => c.checkinStamp === stamp);
                    const value = isMeasuredHabit
                        ? dayCheckins.reduce((sum, c) => sum + Number(c.value || 0), 0)
                        : (dayCheckins.length > 0 ? 1 : 0);
                    bars.push({ value, max: habitGoal, label: formatDate(d) });
                }
            } else if (mode === 'week') {
                const weekExp = Math.max(1, Math.ceil(getExpectedWeeklyFreq(habit)));
                const weekCount = Math.min(8, Math.ceil(ageDays / 7));
                for (let w = weekCount - 1; w >= 0; w--) {
                    const stamps = [];
                    for (let d = 0; d < 7; d++) {
                        const dt = new Date(now); dt.setDate(dt.getDate() - (w * 7 + d));
                        stamps.push(getStamp(dt));
                    }
                    const weekCheckins = activityCheckins.filter(c => stamps.includes(c.checkinStamp));
                    const value = isMeasuredHabit
                        ? weekCheckins.reduce((sum, c) => sum + Number(c.value || 0), 0)
                        : weekCheckins.length;
                    bars.push({ value, max: isMeasuredHabit ? weekExp * habitGoal : weekExp, label: w === 0 ? 'This week' : w === 1 ? 'Last week' : `${w}w ago` });
                }
            } else if (mode === 'month') {
                const monthCount = Math.min(12, Math.ceil(ageDays / 30));
                for (let m = monthCount - 1; m >= 0; m--) {
                    const monthDate = new Date(now.getFullYear(), now.getMonth() - m, 1);
                    const monthEnd = new Date(now.getFullYear(), now.getMonth() - m + 1, 0);
                    const monthStamps = [];
                    for (let d = 1; d <= monthEnd.getDate(); d++) {
                        const dt = new Date(monthDate.getFullYear(), monthDate.getMonth(), d);
                        if (dt <= now) monthStamps.push(getStamp(dt));
                    }
                    const monthCheckins = activityCheckins.filter(c => monthStamps.includes(c.checkinStamp));
                    const done = isMeasuredHabit
                        ? monthCheckins.reduce((sum, c) => sum + Number(c.value || 0), 0)
                        : monthCheckins.length;
                    const monthExp = Math.max(1, Math.round(getExpectedWeeklyFreq(habit) * monthStamps.length / 7));
                    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                    bars.push({ value: done, max: isMeasuredHabit ? monthExp * habitGoal : monthExp, label: months[monthDate.getMonth()] });
                }
            }

            let html = '<div class="history-bars">';
            for (const bar of bars) {
                const heightPct = Math.min(100, Math.max(3, (bar.value / Math.max(1, bar.max)) * 100));
                const pct = bar.max > 0 ? Math.round((bar.value / bar.max) * 100) : 0;
                const color = bar.value === 0 ? '#e8e8e8' : (pct >= 80 ? '#10b981' : pct >= 50 ? '#f59e0b' : '#ef4444');
                const shortLabel = mode === 'week'
                    ? (bar.label === 'This week' ? 'Now' : bar.label.replace('Last week', '1w').replace(' ago', ''))
                    : bar.label;
                html += `<div class="h-bar-wrap"><span class="h-bar-value">${bar.value}${bar.max > 1 ? '/' + bar.max : ''}</span><div class="h-bar-track"><div class="h-bar" style="height:${heightPct}%;background:${color}"><div class="h-tip">${bar.label}: ${bar.value}${bar.max > 1 ? '/' + bar.max : ''}</div></div></div><span class="h-bar-label">${shortLabel}</span></div>`;
            }
            html += '</div>';
            return html;
        }

        // Heatmap tab switching
        function switchHeatmap(view) {
            document.querySelectorAll('.heatmap-tabs .view-tab').forEach(t => t.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
            ['Day','Week','Month'].forEach(v => {
                const el = document.getElementById('heatmap' + v);
                if (el) el.style.display = v.toLowerCase() === view ? 'block' : 'none';
            });
        }

        // History tab switching
        function switchHistory(view) {
            document.querySelectorAll('.history-tabs .view-tab').forEach(t => t.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
            const habit = renderedHabits.find(h => h.id === selectedHabitId);
            if (habit) {
                document.getElementById('historyContainer').innerHTML = buildHistoryChart(habit, view);
            }
        }

        function getHabitTodayState(habit) {
                const checkins = allCheckins[habit.id] || [];
                const today = todayStamp();
                if (isHabitExcludedOnStamp(habit, today)) {
                    return { completed: false, partial: false, scheduled: false, actionable: false };
                }
                const todayCheckin = checkins.find(c => c.checkinStamp === today);
                const completed = Boolean(todayCheckin && todayCheckin.status === 2);
                const partial = Boolean(todayCheckin && !completed && Number(todayCheckin.value) > 0);
                const scheduledDays = getByDaySchedule(habit);
                let scheduled = scheduledDays
                    ? scheduledDays.includes(new Date().getDay())
                    : String(habit.repeatRule || '').includes('FREQ=DAILY');

                if (!scheduled && !scheduledDays && !String(habit.repeatRule || '').includes('FREQ=DAILY')) {
                    const weekStart = new Date();
                    weekStart.setHours(0, 0, 0, 0);
                    weekStart.setDate(weekStart.getDate() - 6);
                    const cycleDone = checkins.filter(c => c.status === 2 && stampToDate(c.checkinStamp) >= weekStart).length;
                    scheduled = cycleDone < Math.max(1, Math.ceil(getExpectedWeeklyFreq(habit)));
                }

                return { completed, partial, scheduled, actionable: scheduled && !completed };
            }

        function matchesHabitDuration(habit) {
                const minutes = getHabitDurationMinutes(habit);
                if (habitDurationFilter === 'all') return true;
                if (habitDurationFilter === 'none') return minutes === 0;
                if (habitDurationFilter === '120+') return minutes > 120;
                const [min, max] = habitDurationFilter.split('-').map(Number);
                return minutes >= min && minutes <= max;
        }

        function matchesHabitSearchAndType(habit) {
            const search = habitSearchFilter.trim().toLowerCase();
            const matchesSearch = !search || String(habit.name || '').toLowerCase().includes(search);
            const matchesType = habitTypeFilter === 'all' || habit.type === habitTypeFilter;
            return matchesSearch && matchesType;
        }

        function setHabitFilter(kind, value) {
                if (kind === 'view') habitViewFilter = value;
                if (kind === 'duration') habitDurationFilter = value;
                if (kind === 'sort') habitSortFilter = value;
                if (kind === 'search') habitSearchFilter = value;
                if (kind === 'type') habitTypeFilter = value;
                currentFilter = habitViewFilter;
                saveHabitFilters();
                render();
        }

        function saveHabitFilters() {
            const filterState = {
                view: habitViewFilter,
                duration: habitDurationFilter,
                sort: habitSortFilter,
                search: habitSearchFilter,
                type: habitTypeFilter
            };
            try {
                localStorage.setItem('habit_filter_state', JSON.stringify(filterState));
            } catch (error) {
                console.warn('[HABITS] Could not save filter preferences:', error);
            }
        }

        function restoreHabitFilters() {
            try {
                const saved = JSON.parse(localStorage.getItem('habit_filter_state') || '{}');
                const viewSelect = document.getElementById('habitViewFilter');
                const durationSelect = document.getElementById('habitDurationFilter');
                const sortSelect = document.getElementById('habitSortFilter');
                const typeSelect = document.getElementById('habitTypeFilter');
                const searchInput = document.getElementById('habitSearchFilter');
                const hasOption = (select, value) => select && Array.from(select.options).some(option => option.value === value);

                if (hasOption(viewSelect, saved.view)) habitViewFilter = saved.view;
                if (hasOption(durationSelect, saved.duration)) habitDurationFilter = saved.duration;
                if (hasOption(sortSelect, saved.sort)) habitSortFilter = saved.sort;
                if (hasOption(typeSelect, saved.type)) habitTypeFilter = saved.type;
                if (typeof saved.search === 'string') habitSearchFilter = saved.search;
                currentFilter = habitViewFilter;

                if (viewSelect) viewSelect.value = habitViewFilter;
                if (durationSelect) durationSelect.value = habitDurationFilter;
                if (sortSelect) sortSelect.value = habitSortFilter;
                if (typeSelect) typeSelect.value = habitTypeFilter;
                if (searchInput) searchInput.value = habitSearchFilter;
            } catch (error) {
                console.warn('[HABITS] Could not restore filter preferences:', error);
            }
        }

        function showError(msg) {
            document.getElementById('habitContainer').innerHTML = `<div class="no-data">⚠️ ${msg}</div>`;
        }

        // ============ RENDER ============

        function buildMissionHtml(activeHabits) {
            const today = todayStamp();
            const unfinished = activeHabits.filter(h => {
                return !(allCheckins[h.id] || []).some(c => c.checkinStamp === today && c.status === 2);
            }).map(h => {
                const overdueRatio = h._intervalDays > 0 ? h._daysSinceLast / h._intervalDays : 0;
